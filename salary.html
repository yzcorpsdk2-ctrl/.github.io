<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll System · Google Sheets Sync</title>
    <!-- Font Awesome for icons (optional but nice) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f2f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            margin: 0;
        }

        .payroll-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -8px rgba(0, 20, 30, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.6);
            padding: 2rem 2rem 2.5rem;
            transition: all 0.2s;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin: 0 0 0.2rem 0;
            background: linear-gradient(135deg, #1e3c5c, #2b5a7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 i {
            background: #1e3c5c;
            background: linear-gradient(135deg, #1e3c5c, #2b5a7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2rem;
        }

        .subhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            color: #4a627a;
            font-weight: 400;
            border-bottom: 1px solid rgba(98, 138, 168, 0.25);
            padding-bottom: 0.75rem;
        }

        .subhead span {
            font-size: 0.95rem;
            background: #e2edf7;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-weight: 500;
            color: #1e3c5c;
            border: 1px solid #cbdae8;
        }

        .sync-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            background: #eef5fc;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            color: #1f5e8e;
            border: 1px solid #b8d2e8;
        }

        .sync-badge i {
            color: #2b7a4b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem 1.5rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #366185;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group label i {
            font-size: 0.9rem;
            color: #4a7a9c;
        }

        .input-group input {
            background: white;
            border: 1.5px solid #d3e2f0;
            border-radius: 1.2rem;
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            font-weight: 500;
            color: #122b3f;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .input-group input:focus {
            outline: none;
            border-color: #2b7a9c;
            box-shadow: 0 0 0 4px rgba(43, 122, 156, 0.15);
            background: #ffffff;
        }

        .input-group input[type="number"] {
            -moz-appearance: textfield;
        }

        .input-group input[type="number"]::-webkit-inner-spin-button {
            opacity: 0.5;
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            border: none;
            padding: 0.85rem 1.8rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.15s ease;
            letter-spacing: 0.01em;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .btn-primary {
            background: #1e3c5c;
            background: linear-gradient(135deg, #1e3c5c, #255a7c);
            color: white;
            box-shadow: 0 10px 18px -8px #1e3c5c80;
        }

        .btn-primary:hover {
            background: #255a7c;
            transform: translateY(-2px);
            box-shadow: 0 18px 25px -10px #1e3c5c;
        }

        .btn-secondary {
            background: white;
            color: #1e3c5c;
            border: 1.5px solid #bfd6e8;
        }

        .btn-secondary:hover {
            background: #f2f9ff;
            border-color: #8db4d0;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #1f7a4a;
            background: linear-gradient(135deg, #1f7a4a, #2b9b63);
            color: white;
            box-shadow: 0 10px 18px -8px #1f7a4a80;
        }

        .btn-success:hover {
            background: #2b9b63;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        .btn i {
            font-size: 1rem;
        }

        .results-card {
            background: #ffffffd9;
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.8), 0 12px 30px -12px rgba(0, 20, 40, 0.2);
            margin-top: 1rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1.5rem 1.2rem;
        }

        .result-item {
            display: flex;
            flex-direction: column;
        }

        .result-item .label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #50718b;
            margin-bottom: 0.3rem;
        }

        .result-item .value {
            font-size: 1.9rem;
            font-weight: 700;
            color: #0d2c44;
            line-height: 1.2;
            word-break: break-word;
        }

        .result-item .value.currency::before {
            content: '$';
            font-size: 1.2rem;
            font-weight: 500;
            color: #3d6a8c;
            margin-right: 3px;
        }

        .net-pay {
            background: #e7f3ec;
            border-radius: 1.5rem;
            padding: 0.8rem 1rem;
            margin-top: 0.5rem;
            border-left: 6px solid #1f7a4a;
        }

        .net-pay .value {
            font-size: 2.4rem;
            color: #0a3b21;
        }

        .status-message {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            padding: 0.8rem 1.2rem;
            border-radius: 3rem;
            background: #e1eff9;
            color: #12415f;
            margin-top: 1.5rem;
            transition: 0.2s;
        }

        .status-message i {
            font-size: 1.1rem;
        }

        .status-message.error {
            background: #ffe2e2;
            color: #a12b2b;
        }

        .status-message.success {
            background: #dff0e4;
            color: #0e5e32;
        }

        .footnote {
            font-size: 0.8rem;
            color: #6c8ba3;
            text-align: center;
            margin-top: 1.8rem;
            border-top: 1px dashed #c2d6e8;
            padding-top: 1.2rem;
        }

        .footnote code {
            background: #e2edf7;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #1f4870;
        }

        @media (max-width: 700px) {
            .payroll-container {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.7rem;
            }
            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                width: 100%;
            }
            .results-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
<div class="payroll-container">
    <h1>
        <i class="fas fa-calculator"></i> Payroll System
    </h1>
    <div class="subhead">
        <span><i class="fas fa-cloud-upload-alt"></i> Sync to Google Sheets</span>
        <div class="sync-badge">
            <i class="fas fa-circle" style="font-size: 0.5rem; color: #2b7a4b;"></i> Ready
        </div>
    </div>

    <!-- Payroll input form -->
    <div class="form-grid" id="payrollForm">
        <div class="input-group">
            <label><i class="fas fa-user"></i> Employee Name</label>
            <input type="text" id="employeeName" placeholder="e.g. Jane Cooper" value="Jane Cooper">
        </div>
        <div class="input-group">
            <label><i class="fas fa-id-card"></i> Employee ID</label>
            <input type="text" id="employeeId" placeholder="EMP-001" value="EMP-001">
        </div>
        <div class="input-group">
            <label><i class="fas fa-clock"></i> Hours Worked</label>
            <input type="number" id="hoursWorked" step="0.5" min="0" value="40">
        </div>
        <div class="input-group">
            <label><i class="fas fa-dollar-sign"></i> Hourly Rate</label>
            <input type="number" id="hourlyRate" step="0.01" min="0" value="25.50">
        </div>
        <div class="input-group">
            <label><i class="fas fa-percent"></i> Tax Rate (%)</label>
            <input type="number" id="taxRate" step="0.1" min="0" max="100" value="15">
        </div>
        <div class="input-group">
            <label><i class="fas fa-plus-circle"></i> Bonus</label>
            <input type="number" id="bonus" step="0.01" min="0" value="100">
        </div>
    </div>

    <!-- Action buttons -->
    <div class="action-bar">
        <button class="btn btn-primary" id="calculateBtn"><i class="fas fa-sync-alt"></i> Calculate Payroll</button>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-undo-alt"></i> Reset</button>
            <button class="btn btn-success" id="syncBtn"><i class="fas fa-cloud-upload-alt"></i> Sync to Google Sheet</button>
        </div>
    </div>

    <!-- Results display -->
    <div class="results-card">
        <div class="results-grid" id="resultsGrid">
            <div class="result-item">
                <span class="label">Gross Pay</span>
                <span class="value currency" id="grossPayDisplay">0.00</span>
            </div>
            <div class="result-item">
                <span class="label">Tax Amount</span>
                <span class="value currency" id="taxAmountDisplay">0.00</span>
            </div>
            <div class="result-item">
                <span class="label">Net Pay</span>
                <span class="value currency" id="netPayDisplay">0.00</span>
            </div>
            <div class="result-item net-pay" style="grid-column: span 1;">
                <span class="label" style="color: #0e5e32;">Take Home</span>
                <span class="value currency" id="netPayBigDisplay" style="font-size: 2.4rem;">0.00</span>
            </div>
        </div>
    </div>

    <!-- Status message -->
    <div class="status-message" id="statusMessage">
        <i class="fas fa-info-circle"></i> Enter details and click Calculate.
    </div>

    <div class="footnote">
        <i class="fas fa-google"></i> Google Apps Script endpoint: <code>GOOGLE_SHEET_WEBAPP_URL</code> (replace in code)
    </div>
</div>

<script>
    (function() {
        // ============================================================
        // ⚠️ REPLACE THIS with your deployed Google Apps Script Web App URL
        //    Example: 'https://script.google.com/macros/s/AKfycb.../exec'
        // ============================================================
        const GOOGLE_SHEET_WEBAPP_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec'; // <-- CHANGE THIS

        // DOM elements
        const employeeNameInput = document.getElementById('employeeName');
        const employeeIdInput = document.getElementById('employeeId');
        const hoursWorkedInput = document.getElementById('hoursWorked');
        const hourlyRateInput = document.getElementById('hourlyRate');
        const taxRateInput = document.getElementById('taxRate');
        const bonusInput = document.getElementById('bonus');

        const grossPayDisplay = document.getElementById('grossPayDisplay');
        const taxAmountDisplay = document.getElementById('taxAmountDisplay');
        const netPayDisplay = document.getElementById('netPayDisplay');
        const netPayBigDisplay = document.getElementById('netPayBigDisplay');
        const statusMessage = document.getElementById('statusMessage');

        // Helper: format number to 2 decimals
        function formatCurrency(value) {
            return Number(value).toFixed(2);
        }

        // Core calculation logic (returns object with all computed values)
        function calculatePayroll() {
            const hours = parseFloat(hoursWorkedInput.value) || 0;
            const rate = parseFloat(hourlyRateInput.value) || 0;
            const taxRate = parseFloat(taxRateInput.value) || 0;
            const bonus = parseFloat(bonusInput.value) || 0;

            const gross = (hours * rate) + bonus;
            const taxAmount = gross * (taxRate / 100);
            const net = gross - taxAmount;

            return {
                gross: gross,
                tax: taxAmount,
                net: net,
                hours: hours,
                rate: rate,
                taxRate: taxRate,
                bonus: bonus,
                employeeName: employeeNameInput.value.trim() || 'N/A',
                employeeId: employeeIdInput.value.trim() || 'N/A'
            };
        }

        // Update the UI with calculated values
        function updateUIFromCalculation(calc) {
            grossPayDisplay.textContent = formatCurrency(calc.gross);
            taxAmountDisplay.textContent = formatCurrency(calc.tax);
            netPayDisplay.textContent = formatCurrency(calc.net);
            netPayBigDisplay.textContent = formatCurrency(calc.net);
        }

        // Set status message helper
        function setStatus(message, type = 'info') {
            statusMessage.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${message}`;
            statusMessage.className = 'status-message'; // reset
            if (type === 'error') statusMessage.classList.add('error');
            if (type === 'success') statusMessage.classList.add('success');
        }

        // Perform calculation and update UI
        function performCalculation() {
            try {
                const calc = calculatePayroll();
                updateUIFromCalculation(calc);
                return calc;
            } catch (e) {
                setStatus('Calculation error: ' + e.message, 'error');
                return null;
            }
        }

        // ----- Calculate button -----
        document.getElementById('calculateBtn').addEventListener('click', function() {
            const calc = performCalculation();
            if (calc) {
                setStatus('Payroll calculated successfully. Ready to sync.', 'success');
            }
        });

        // ----- Reset button -----
        document.getElementById('resetBtn').addEventListener('click', function() {
            employeeNameInput.value = 'Jane Cooper';
            employeeIdInput.value = 'EMP-001';
            hoursWorkedInput.value = '40';
            hourlyRateInput.value = '25.50';
            taxRateInput.value = '15';
            bonusInput.value = '100';
            performCalculation();
            setStatus('Form reset to defaults.', 'info');
        });

        // ----- Sync to Google Sheets button -----
        document.getElementById('syncBtn').addEventListener('click', async function() {
            // First recalc to ensure current values
            const calc = performCalculation();
            if (!calc) return;

            // Validate required fields
            if (!calc.employeeName || calc.employeeName === 'N/A') {
                setStatus('Please enter a valid Employee Name.', 'error');
                return;
            }
            if (!calc.employeeId || calc.employeeId === 'N/A') {
                setStatus('Please enter a valid Employee ID.', 'error');
                return;
            }

            // Check if webapp URL is configured
            if (GOOGLE_SHEET_WEBAPP_URL.includes('YOUR_DEPLOYMENT_ID') || GOOGLE_SHEET_WEBAPP_URL === '') {
                setStatus('⚠️ Google Sheet Web App URL not configured. Please update the script.', 'error');
                return;
            }

            // Prepare payload
            const payload = {
                employeeName: calc.employeeName,
                employeeId: calc.employeeId,
                hoursWorked: calc.hours,
                hourlyRate: calc.rate,
                taxRate: calc.taxRate,
                bonus: calc.bonus,
                grossPay: calc.gross,
                taxAmount: calc.tax,
                netPay: calc.net,
                timestamp: new Date().toISOString()
            };

            setStatus('Syncing to Google Sheets...', 'info');
            const syncBtn = this;
            syncBtn.disabled = true;
            syncBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Syncing...';

            try {
                // Using fetch with no-cors? Better to use standard POST with text/plain to avoid preflight,
                // but Google Apps Script Web App accepts JSON with CORS.
                // We'll set Content-Type: application/json and expect CORS enabled.
                const response = await fetch(GOOGLE_SHEET_WEBAPP_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                // Try to parse JSON response, but some Apps Script deployments return text
                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (e) {
                    result = { status: 'success', message: responseText };
                }

                if (result.status === 'error') {
                    throw new Error(result.message || 'Unknown error from server');
                }

                setStatus(`✅ Successfully synced ${calc.employeeName} to Google Sheets!`, 'success');
            } catch (error) {
                console.error('Sync error:', error);
                setStatus(`❌ Sync failed: ${error.message}. Check console and Web App URL.`, 'error');
            } finally {
                syncBtn.disabled = false;
                syncBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Sync to Google Sheet';
            }
        });

        // Initial calculation on page load
        window.addEventListener('DOMContentLoaded', () => {
            performCalculation();
            setStatus('Ready. Adjust values and click Calculate.', 'info');
        });

        // Also recalc on Enter key in any input for convenience
        const inputs = document.querySelectorAll('#payrollForm input');
        inputs.forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performCalculation();
                    setStatus('Payroll recalculated.', 'success');
                }
            });
        });
    })();
</script>
</body>
</html>
