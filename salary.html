<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payroll System · Google Sheet + PDF + Print</title>
  <!-- Font Awesome Icons (optional but nice) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fc;
      padding: 2rem 1.5rem;
      color: #1e293b;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      color: #0f172a;
    }
    h1 i {
      color: #2563eb;
    }
    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
      padding: 1.75rem;
      margin-bottom: 2rem;
      border: 1px solid #e9eef3;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    .btn {
      background: white;
      border: 1px solid #cdd9e6;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.15s ease;
      color: #1e293b;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }
    .btn i {
      font-size: 1rem;
    }
    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }
    .btn-outline {
      background: white;
    }
    .btn-outline:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .btn-danger {
      background: #fee2e2;
      border-color: #fecaca;
      color: #b91c1c;
    }
    .btn-danger:hover {
      background: #fecaca;
    }
    .btn-sm {
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
    }
    .btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.3);
    }
    .table-wrapper {
      overflow-x: auto;
      border-radius: 18px;
      border: 1px solid #e9eef3;
      background: #ffffff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      min-width: 1000px;
    }
    th {
      text-align: left;
      padding: 1rem 1rem 0.85rem 1rem;
      background: #f8fafc;
      font-weight: 600;
      color: #334155;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }
    td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid #edf2f7;
      vertical-align: middle;
      background: white;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .input-field {
      width: 100%;
      min-width: 90px;
      border: 1px solid #d1d9e6;
      border-radius: 12px;
      padding: 0.6rem 0.75rem;
      font-size: 0.9rem;
      background: #ffffff;
      transition: 0.15s;
      font-family: inherit;
    }
    .input-field:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .input-field[readonly] {
      background: #f1f5f9;
      border-color: #e2e8f0;
      color: #0f172a;
      font-weight: 500;
    }
    .text-right {
      text-align: right;
    }
    .status-badge {
      font-size: 0.75rem;
      background: #dcfce7;
      color: #166534;
      padding: 0.25rem 0.75rem;
      border-radius: 30px;
      font-weight: 600;
      white-space: nowrap;
    }
    .footer-note {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #1e293b;
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 60px;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.3);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 9999;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .toast i {
      color: #4ade80;
    }
    .sheet-note {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #eef6ff;
      border-radius: 40px;
      padding: 0.5rem 1.2rem;
      color: #1e40af;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .sheet-note i {
      color: #2563eb;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* print styles */
    @media print {
      body {
        background: white;
        padding: 0.5in;
      }
      .toolbar, .btn, .toast, .sheet-note, .no-print {
        display: none !important;
      }
      .card {
        box-shadow: none;
        border: 1px solid #ccc;
        padding: 0.5rem;
      }
      .table-wrapper {
        border: 1px solid #aaa;
      }
      th {
        background: #eee;
      }
      .input-field {
        border: none;
        background: transparent;
        padding: 0.2rem 0.2rem;
        font-weight: 500;
      }
      .input-field[readonly] {
        background: transparent;
      }
      .status-badge {
        background: #eee;
        color: black;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <i class="fas fa-calculator"></i> Payroll System
      <span style="font-size: 0.9rem; font-weight: 400; margin-left: auto; color: #475569;">
        <i class="fas fa-cloud-upload-alt"></i> Google Sheet ready
      </span>
    </h1>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="btn btn-primary" id="saveToSheetBtn">
          <i class="fas fa-cloud-upload-alt"></i> Save to Google Sheet
        </button>
        <button class="btn btn-outline" id="exportPdfBtn">
          <i class="fas fa-file-pdf"></i> Download PDF
        </button>
        <button class="btn btn-outline" id="printBtn">
          <i class="fas fa-print"></i> Print
        </button>
        <button class="btn btn-outline" id="addRowBtn">
          <i class="fas fa-plus-circle"></i> Add Employee
        </button>
        <button class="btn btn-danger" id="resetDataBtn">
          <i class="fas fa-undo-alt"></i> Reset
        </button>
      </div>
      <div class="sheet-note no-print">
        <i class="fas fa-table"></i> Data syncs to Google Sheet via Apps Script
      </div>
    </div>

    <!-- Payroll Table Card -->
    <div class="card">
      <div class="section-title">
        <i class="fas fa-users"></i> Employee Payroll — <span id="monthDisplay">April 2025</span>
      </div>
      <div class="table-wrapper">
        <table id="payrollTable">
          <thead>
            <tr>
              <th>Employee ID</th>
              <th>Name</th>
              <th>Basic Salary (RM)</th>
              <th>Allowance (RM)</th>
              <th>Deduction (RM)</th>
              <th>EPF (11%)</th>
              <th>SOCSO (0.5%)</th>
              <th>Net Salary (RM)</th>
              <th class="no-print">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- rows will be populated by JS -->
          </tbody>
        </table>
      </div>
      <div class="footer-note">
        <i class="fas fa-info-circle"></i> Net Salary = Basic + Allowance - Deduction - EPF - SOCSO
      </div>
    </div>
  </div>

  <!-- Toast message -->
  <div id="toast" class="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage">Saved!</span>
  </div>

  <script>
    // ============================================================
    // PAYROLL SYSTEM – with Google Sheet integration (via Apps Script)
    // ============================================================

    // ----- CONFIGURATION -----
    // Replace with your own Google Apps Script Web App URL.
    // If you don't have one yet, the "Save to Google Sheet" will show a demo alert.
    const GOOGLE_SHEET_WEBAPP_URL = ''; // e.g. "https://script.google.com/macros/s/AKfy.../exec"

    // ----- DATA MODEL -----
    let employees = [
      { id: 'EMP001', name: 'Ahmad bin Ali', basic: 4500.00, allowance: 600.00, deduction: 150.00 },
      { id: 'EMP002', name: 'Siti Nurhaliza', basic: 3800.00, allowance: 450.00, deduction: 80.00 },
      { id: 'EMP003', name: 'Chong Wei Ming', basic: 5200.00, allowance: 800.00, deduction: 200.00 },
      { id: 'EMP004', name: 'Priya a/p Sharma', basic: 4200.00, allowance: 550.00, deduction: 120.00 },
    ];

    // ----- HELPER: calculation -----
    function calculateRow(emp) {
      const basic = Number(emp.basic) || 0;
      const allowance = Number(emp.allowance) || 0;
      const deduction = Number(emp.deduction) || 0;
      const epf = basic * 0.11;      // 11% of basic
      const socso = basic * 0.005;   // 0.5% of basic
      const net = basic + allowance - deduction - epf - socso;
      return { epf, socso, net };
    }

    // ----- RENDER TABLE -----
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      employees.forEach((emp, index) => {
        const { epf, socso, net } = calculateRow(emp);

        const tr = document.createElement('tr');
        tr.dataset.index = index;

        // ID (editable)
        const tdId = document.createElement('td');
        const inputId = document.createElement('input');
        inputId.type = 'text';
        inputId.className = 'input-field';
        inputId.value = emp.id;
        inputId.dataset.field = 'id';
        inputId.addEventListener('input', (e) => updateField(index, 'id', e.target.value));
        tdId.appendChild(inputId);
        tr.appendChild(tdId);

        // Name (editable)
        const tdName = document.createElement('td');
        const inputName = document.createElement('input');
        inputName.type = 'text';
        inputName.className = 'input-field';
        inputName.value = emp.name;
        inputName.dataset.field = 'name';
        inputName.addEventListener('input', (e) => updateField(index, 'name', e.target.value));
        tdName.appendChild(inputName);
        tr.appendChild(tdName);

        // Basic (editable)
        const tdBasic = document.createElement('td');
        const inputBasic = document.createElement('input');
        inputBasic.type = 'number';
        inputBasic.step = '0.01';
        inputBasic.className = 'input-field';
        inputBasic.value = emp.basic;
        inputBasic.dataset.field = 'basic';
        inputBasic.addEventListener('input', (e) => updateField(index, 'basic', parseFloat(e.target.value) || 0));
        tdBasic.appendChild(inputBasic);
        tr.appendChild(tdBasic);

        // Allowance (editable)
        const tdAllow = document.createElement('td');
        const inputAllow = document.createElement('input');
        inputAllow.type = 'number';
        inputAllow.step = '0.01';
        inputAllow.className = 'input-field';
        inputAllow.value = emp.allowance;
        inputAllow.dataset.field = 'allowance';
        inputAllow.addEventListener('input', (e) => updateField(index, 'allowance', parseFloat(e.target.value) || 0));
        tdAllow.appendChild(inputAllow);
        tr.appendChild(tdAllow);

        // Deduction (editable)
        const tdDeduct = document.createElement('td');
        const inputDeduct = document.createElement('input');
        inputDeduct.type = 'number';
        inputDeduct.step = '0.01';
        inputDeduct.className = 'input-field';
        inputDeduct.value = emp.deduction;
        inputDeduct.dataset.field = 'deduction';
        inputDeduct.addEventListener('input', (e) => updateField(index, 'deduction', parseFloat(e.target.value) || 0));
        tdDeduct.appendChild(inputDeduct);
        tr.appendChild(tdDeduct);

        // EPF (readonly)
        const tdEpf = document.createElement('td');
        const inputEpf = document.createElement('input');
        inputEpf.type = 'text';
        inputEpf.className = 'input-field';
        inputEpf.readOnly = true;
        inputEpf.value = epf.toFixed(2);
        tdEpf.appendChild(inputEpf);
        tr.appendChild(tdEpf);

        // SOCSO (readonly)
        const tdSocso = document.createElement('td');
        const inputSocso = document.createElement('input');
        inputSocso.type = 'text';
        inputSocso.className = 'input-field';
        inputSocso.readOnly = true;
        inputSocso.value = socso.toFixed(2);
        tdSocso.appendChild(inputSocso);
        tr.appendChild(tdSocso);

        // Net Salary (readonly)
        const tdNet = document.createElement('td');
        const inputNet = document.createElement('input');
        inputNet.type = 'text';
        inputNet.className = 'input-field';
        inputNet.readOnly = true;
        inputNet.value = net.toFixed(2);
        tdNet.appendChild(inputNet);
        tr.appendChild(tdNet);

        // Actions (delete button)
        const tdAction = document.createElement('td');
        tdAction.className = 'no-print';
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn btn-sm btn-danger';
        deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
        deleteBtn.title = 'Delete employee';
        deleteBtn.addEventListener('click', () => deleteEmployee(index));
        tdAction.appendChild(deleteBtn);
        tr.appendChild(tdAction);

        tbody.appendChild(tr);
      });
    }

    // ----- UPDATE FIELD -----
    function updateField(index, field, value) {
      if (!employees[index]) return;
      employees[index][field] = value;

      // If basic, allowance or deduction changed → re-render full row (or just recalc fields)
      // For simplicity, re-render entire table (small data, fine)
      if (field === 'basic' || field === 'allowance' || field === 'deduction') {
        // Preserve focus? We'll re-render but that's acceptable for demo.
        renderTable();
      } else {
        // update only the changed field in the model, no need to re-render everything
        // but to keep consistency we can just re-render, but it's okay to skip for non-calc fields
        // However when ID/Name changed we don't need re-render, but we must keep model updated
        // The UI already reflects it. We'll just re-render to be safe? Might lose focus.
        // Better: only re-render when necessary (calc fields). 
        // For id/name we don't need re-render. So we do nothing more.
        // But we have to update the corresponding row's dataset index? No.
      }
    }

    // ----- DELETE EMPLOYEE -----
    function deleteEmployee(index) {
      if (confirm('Delete this employee record?')) {
        employees.splice(index, 1);
        renderTable();
        showToast('Employee removed');
      }
    }

    // ----- ADD NEW EMPLOYEE -----
    function addEmployee() {
      const newId = `EMP${String(employees.length + 1).padStart(3, '0')}`;
      employees.push({
        id: newId,
        name: 'New Employee',
        basic: 3000.00,
        allowance: 0.00,
        deduction: 0.00
      });
      renderTable();
      showToast('New employee added');
    }

    // ----- RESET TO DEFAULT -----
    function resetData() {
      if (confirm('Reset to default sample data?')) {
        employees = [
          { id: 'EMP001', name: 'Ahmad bin Ali', basic: 4500.00, allowance: 600.00, deduction: 150.00 },
          { id: 'EMP002', name: 'Siti Nurhaliza', basic: 3800.00, allowance: 450.00, deduction: 80.00 },
          { id: 'EMP003', name: 'Chong Wei Ming', basic: 5200.00, allowance: 800.00, deduction: 200.00 },
          { id: 'EMP004', name: 'Priya a/p Sharma', basic: 4200.00, allowance: 550.00, deduction: 120.00 },
        ];
        renderTable();
        showToast('Data reset to default');
      }
    }

    // ----- TOAST -----
    function showToast(message, isSuccess = true) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      toastMsg.textContent = message;
      toast.querySelector('i').className = isSuccess ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    // ----- SAVE TO GOOGLE SHEET (via Apps Script Web App) -----
    async function saveToGoogleSheet() {
      // Prepare data for sheet: array of objects
      const payload = employees.map(emp => {
        const { epf, socso, net } = calculateRow(emp);
        return {
          id: emp.id,
          name: emp.name,
          basic: emp.basic,
          allowance: emp.allowance,
          deduction: emp.deduction,
          epf: parseFloat(epf.toFixed(2)),
          socso: parseFloat(socso.toFixed(2)),
          net: parseFloat(net.toFixed(2)),
          timestamp: new Date().toISOString()
        };
      });

      // If no webapp URL configured, simulate success with a note.
      if (!GOOGLE_SHEET_WEBAPP_URL) {
        // DEMO MODE: just show a message.
        console.log('Google Sheet payload:', payload);
        showToast('Demo: data logged to console. Configure Apps Script URL.', true);
        // Also show a small alert? better to keep toast.
        return;
      }

      try {
        const response = await fetch(GOOGLE_SHEET_WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors', // avoid CORS issues with Apps Script
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payroll: payload })
        });
        // With no-cors we can't read response, but we assume success.
        showToast('Payroll saved to Google Sheet ✓');
      } catch (error) {
        console.error('Save error:', error);
        showToast('Failed to save to Google Sheet. Check console.', false);
      }
    }

    // ----- EXPORT PDF (using print to PDF) -----
    function exportPDF() {
      // Simply trigger print with a suggestion to save as PDF
      window.print();
      showToast('Use "Save as PDF" in print dialog', true);
    }

    // ----- PRINT -----
    function printPage() {
      window.print();
    }

    // ----- ATTACH EVENTS -----
    window.addEventListener('DOMContentLoaded', () => {
      renderTable();

      document.getElementById('addRowBtn').addEventListener('click', addEmployee);
      document.getElementById('resetDataBtn').addEventListener('click', resetData);
      document.getElementById('saveToSheetBtn').addEventListener('click', saveToGoogleSheet);
      document.getElementById('exportPdfBtn').addEventListener('click', exportPDF);
      document.getElementById('printBtn').addEventListener('click', printPage);
    });

    // Expose some functions for debugging
    window.payroll = { employees, renderTable };
  </script>
</body>
</html>
