<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Sistem Pengurusan Staf - Menu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }
        h1 {
            color: #1a3a5c;
            font-size: 24px;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        /* Language Bar */
        .lang-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .lang-btn {
            padding: 6px 16px;
            border: 2px solid #1a3a5c;
            background: transparent;
            color: #1a3a5c;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        .lang-btn.active, .lang-btn:hover {
            background: #1a3a5c;
            color: white;
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }
        .menu-btn {
            padding: 18px 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            background: #e8edf3;
            color: #1a3a5c;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .menu-btn:hover {
            background: #1a3a5c;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26,58,92,0.3);
        }
        .menu-btn .icon {
            font-size: 28px;
        }
        .menu-btn .label {
            font-size: 13px;
        }
        .menu-btn.full {
            grid-column: 1 / -1;
        }

        .menu-btn.primary {
            background: #1a3a5c;
            color: white;
        }
        .menu-btn.primary:hover {
            background: #0f2a44;
        }
        .menu-btn.success {
            background: #38a169;
            color: white;
        }
        .menu-btn.success:hover {
            background: #2f855a;
        }
        .menu-btn.warning {
            background: #d4a373;
            color: white;
        }
        .menu-btn.warning:hover {
            background: #b8834f;
        }
        .menu-btn.danger {
            background: #c53030;
            color: white;
        }
        .menu-btn.danger:hover {
            background: #9b2c2c;
        }
        .menu-btn.purple {
            background: #805ad5;
            color: white;
        }
        .menu-btn.purple:hover {
            background: #6b46c1;
        }
        .menu-btn.teal {
            background: #319795;
            color: white;
        }
        .menu-btn.teal:hover {
            background: #2c7a7b;
        }
        .menu-btn.pink {
            background: #d53f8c;
            color: white;
        }
        .menu-btn.pink:hover {
            background: #b83280;
        }

        .menu-divider {
            border-top: 2px solid #e2e8f0;
            margin: 20px 0 16px 0;
        }

        .footer-text {
            color: #a0aec0;
            font-size: 12px;
            margin-top: 20px;
        }

        /* Status Bar */
        .status-bar {
            background: #edf2f7;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: #4a5568;
            margin-bottom: 16px;
            text-align: center;
        }
        .status-bar.success { background: #c6f6d5; color: #22543d; }
        .status-bar.error { background: #fed7d7; color: #9b2c2c; }

        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .menu-grid { gap: 10px; }
            .menu-btn { padding: 14px 10px; font-size: 13px; }
            .menu-btn .icon { font-size: 24px; }
            .lang-btn { font-size: 12px; padding: 4px 12px; }
        }
        @media (max-width: 380px) {
            .menu-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📋</div>
        <h1 id="mainTitle">Sistem Pengurusan Staf</h1>
        <p class="subtitle" id="subtitle">Pilih menu di bawah untuk navigasi</p>

        <!-- Language Bar -->
        <div class="lang-bar">
            <button class="lang-btn active" data-lang="ms" onclick="setLanguage('ms')">Bahasa Melayu</button>
            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" data-lang="zh" onclick="setLanguage('zh')">中文</button>
        </div>

        <!-- Status Bar -->
        <div id="statusBar" class="status-bar">🔌 Menyambung...</div>

        <!-- Menu Grid - 使用 <a> 标签直接跳转 -->
        <div class="menu-grid">
            <!-- Daftar / Log Masuk -> index.html -->
            <a href="https://yzcorpsdk2-ctrl.github.io/.github.io/index.html" class="menu-btn primary">
                <span class="icon">📝</span>
                <span class="label" id="menuSignLog">Daftar / Log Masuk</span>
            </a>
            
            <!-- Staff Info -> staffinfo.html -->
            <a href="https://yzcorpsdk2-ctrl.github.io/.github.io/staffinfo.html" class="menu-btn success">
                <span class="icon">📇</span>
                <span class="label" id="menuStaffInfo">Staff Info</span>
            </a>
            
            <!-- Punch Card -> punch.html -->
            <a href="https://yzcorpsdk2-ctrl.github.io/.github.io/punch.html" class="menu-btn pink">
                <span class="icon">🕐</span>
                <span class="label" id="menuPunch">Punch Card Record</span>
            </a>
            
            <!-- Payroll -> salary.html -->
            <a href="https://yzcorpsdk2-ctrl.github.io/.github.io/salary.html" class="menu-btn purple">
                <span class="icon">💰</span>
                <span class="label" id="menuPayroll">Payroll</span>
            </a>
            
            <!-- Menu 2 -->
            <a href="https://yzcorpsdk2-ctrl.github.io/.github.io/menu2.html" class="menu-btn teal">
                <span class="icon">📁</span>
                <span class="label" id="menu2">Menu 2</span>
            </a>
            
            <!-- Menu 3 -->
            <a href="https://yzcorpsdk2-ctrl.github.io/.github.io/menu3.html" class="menu-btn danger">
                <span class="icon">📁</span>
                <span class="label" id="menu3">Menu 3</span>
            </a>
        </div>

        <div class="menu-divider"></div>

        <div class="footer-text" id="footerText">© 2026 Sistem Pengurusan Staf</div>
    </div>

    <script>
        // ============= CONFIG =============
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzMvU6u4HEWNoULZedWPs3XvjJMY8fb-J3UDCRbNeRnijj7DDbqPXnb07RlL2st0xsmHQ/exec';
        
        let currentLanguage = 'ms';

        // ============= TRANSLATIONS =============
        const translations = {
            ms: {
                title: 'Sistem Pengurusan Staf',
                subtitle: 'Pilih menu di bawah untuk navigasi',
                signlog: '📝 Daftar / Log Masuk',
                staffInfo: '📇 Staff Info',
                punch: '🕐 Punch Card Record',
                payroll: '💰 Payroll',
                menu2: '📁 Menu 2',
                menu3: '📁 Menu 3',
                footer: '© 2026 Sistem Pengurusan Staf',
                connecting: '🔌 Menyambung...',
                connected: '✅ Bersambung!',
                connectionFail: '❌ Sambungan gagal: ',
            },
            en: {
                title: 'Staff Management System',
                subtitle: 'Select a menu below to navigate',
                signlog: '📝 Sign Up / Login',
                staffInfo: '📇 Staff Info',
                punch: '🕐 Punch Card Record',
                payroll: '💰 Payroll',
                menu2: '📁 Menu 2',
                menu3: '📁 Menu 3',
                footer: '© 2026 Staff Management System',
                connecting: '🔌 Connecting...',
                connected: '✅ Connected!',
                connectionFail: '❌ Connection failed: ',
            },
            zh: {
                title: '员工管理系统',
                subtitle: '选择下方菜单进行导航',
                signlog: '📝 注册 / 登录',
                staffInfo: '📇 员工信息',
                punch: '🕐 打卡记录',
                payroll: '💰 薪资管理',
                menu2: '📁 菜单 2',
                menu3: '📁 菜单 3',
                footer: '© 2026 员工管理系统',
                connecting: '🔌 连接中...',
                connected: '✅ 已连接！',
                connectionFail: '❌ 连接失败：',
            }
        };

        function t(key) {
            return translations[currentLanguage]?.[key] || key;
        }

        // ============= LANGUAGE =============
        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === lang);
            });
            updateAllTexts();
        }

        function updateAllTexts() {
            document.getElementById('mainTitle').textContent = t('title');
            document.getElementById('subtitle').textContent = t('subtitle');
            document.getElementById('menuSignLog').textContent = t('signlog');
            document.getElementById('menuStaffInfo').textContent = t('staffInfo');
            document.getElementById('menuPunch').textContent = t('punch');
            document.getElementById('menuPayroll').textContent = t('payroll');
            document.getElementById('menu2').textContent = t('menu2');
            document.getElementById('menu3').textContent = t('menu3');
            document.getElementById('footerText').textContent = t('footer');
        }

        // ============= STATUS =============
        function updateStatus(msg, type = '') {
            const el = document.getElementById('statusBar');
            el.textContent = msg;
            el.className = 'status-bar ' + type;
        }

        // ============= CONNECTION TEST =============
        function testConnection() {
            updateStatus(t('connecting'));
            
            fetch(SCRIPT_URL + '?action=getData')
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(data => {
                const count = data.length || 0;
                updateStatus(t('connected') + ' ' + count + ' rekod ditemui.', 'success');
                console.log('✅ Connection successful. Data:', data);
            })
            .catch(err => {
                updateStatus(t('connectionFail') + err.message, 'error');
                console.error('❌ Connection error:', err);
            });
        }

        // ============= INIT =============
        window.addEventListener('load', function() {
            console.log('🚀 Menu loaded');
            console.log('📍 Current URL:', window.location.href);
            console.log('📋 Apps Script URL:', SCRIPT_URL);
            
            setTimeout(testConnection, 500);
            setLanguage('ms');
        });
    </script>
</body>
</html>
