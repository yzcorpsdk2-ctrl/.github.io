<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Sistem Pengurusan Staf - Menu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }
        h1 {
            color: #1a3a5c;
            font-size: 24px;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        /* Language Bar */
        .lang-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .lang-btn {
            padding: 6px 16px;
            border: 2px solid #1a3a5c;
            background: transparent;
            color: #1a3a5c;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        .lang-btn.active, .lang-btn:hover {
            background: #1a3a5c;
            color: white;
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }
        .menu-btn {
            padding: 18px 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            background: #e8edf3;
            color: #1a3a5c;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .menu-btn:hover {
            background: #1a3a5c;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26,58,92,0.3);
        }
        .menu-btn .icon {
            font-size: 28px;
        }
        .menu-btn .label {
            font-size: 13px;
        }
        .menu-btn.full {
            grid-column: 1 / -1;
        }

        .menu-btn.primary {
            background: #1a3a5c;
            color: white;
        }
        .menu-btn.primary:hover {
            background: #0f2a44;
        }
        .menu-btn.success {
            background: #38a169;
            color: white;
        }
        .menu-btn.success:hover {
            background: #2f855a;
        }
        .menu-btn.warning {
            background: #d4a373;
            color: white;
        }
        .menu-btn.warning:hover {
            background: #b8834f;
        }
        .menu-btn.danger {
            background: #c53030;
            color: white;
        }
        .menu-btn.danger:hover {
            background: #9b2c2c;
        }
        .menu-btn.purple {
            background: #805ad5;
            color: white;
        }
        .menu-btn.purple:hover {
            background: #6b46c1;
        }
        .menu-btn.teal {
            background: #319795;
            color: white;
        }
        .menu-btn.teal:hover {
            background: #2c7a7b;
        }
        .menu-btn.pink {
            background: #d53f8c;
            color: white;
        }
        .menu-btn.pink:hover {
            background: #b83280;
        }

        .menu-divider {
            border-top: 2px solid #e2e8f0;
            margin: 20px 0 16px 0;
        }

        .footer-text {
            color: #a0aec0;
            font-size: 12px;
            margin-top: 20px;
        }

        /* Status Bar */
        .status-bar {
            background: #edf2f7;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: #4a5568;
            margin-bottom: 16px;
            text-align: center;
        }
        .status-bar.success { background: #c6f6d5; color: #22543d; }
        .status-bar.error { background: #fed7d7; color: #9b2c2c; }

        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .menu-grid { gap: 10px; }
            .menu-btn { padding: 14px 10px; font-size: 13px; }
            .menu-btn .icon { font-size: 24px; }
            .lang-btn { font-size: 12px; padding: 4px 12px; }
        }
        @media (max-width: 380px) {
            .menu-grid { grid-template-columns: 1fr; }
        }

        /* Auth Overlay Styles */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .auth-overlay.show {
            display: flex;
        }
        .auth-overlay .auth-box {
            background: white;
            padding: 30px 24px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-overlay .auth-box h3 {
            text-align: center;
            color: #1a3a5c;
            margin-bottom: 16px;
        }
        .auth-overlay .auth-box .form-group {
            margin-bottom: 12px;
        }
        .auth-overlay .auth-box .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #2d3748;
            margin-bottom: 4px;
        }
        .auth-overlay .auth-box .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            background: #fafcfd;
        }
        .auth-overlay .auth-box .form-group input:focus {
            border-color: #1a3a5c;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,58,92,0.1);
        }
        .auth-overlay .auth-box .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 8px;
        }
        .auth-overlay .auth-box .btn-primary {
            background: #1a3a5c;
            color: white;
        }
        .auth-overlay .auth-box .btn-primary:hover {
            background: #0f2a44;
        }
        .auth-overlay .auth-box .btn-gray {
            background: #e2e8f0;
            color: #4a5568;
        }
        .auth-overlay .auth-box .btn-gray:hover {
            background: #cbd5e0;
        }
        .auth-overlay .auth-box .error-msg {
            color: #c53030;
            font-size: 14px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📋</div>
        <h1 id="mainTitle">Sistem Pengurusan Staf</h1>
        <p class="subtitle" id="subtitle">Pilih menu di bawah untuk navigasi</p>

        <!-- Language Bar -->
        <div class="lang-bar">
            <button class="lang-btn active" data-lang="ms" onclick="setLanguage('ms')">Bahasa Melayu</button>
            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" data-lang="zh" onclick="setLanguage('zh')">中文</button>
        </div>

        <!-- Status Bar -->
        <div id="statusBar" class="status-bar">🔌 Menyambung...</div>

        <!-- Menu Grid -->
        <div class="menu-grid">
            <button class="menu-btn primary" onclick="navigateTo('signlog')">
                <span class="icon">📝</span>
                <span class="label" id="menuSignLog">Daftar / Log Masuk</span>
            </button>
            <button class="menu-btn success" onclick="navigateTo('staffinfo')">
                <span class="icon">📇</span>
                <span class="label" id="menuStaffInfo">Staff Info</span>
            </button>
            <button class="menu-btn pink" onclick="navigateTo('punch')">
                <span class="icon">🕐</span>
                <span class="label" id="menuPunch">Punch Card Record</span>
            </button>
            <button class="menu-btn purple" onclick="navigateTo('menu1')">
                <span class="icon">📁</span>
                <span class="label" id="menu1">Menu 1</span>
            </button>
            <button class="menu-btn teal" onclick="navigateTo('menu2')">
                <span class="icon">📁</span>
                <span class="label" id="menu2">Menu 2</span>
            </button>
            <button class="menu-btn danger" onclick="navigateTo('menu3')">
                <span class="icon">📁</span>
                <span class="label" id="menu3">Menu 3</span>
            </button>
        </div>

        <div class="menu-divider"></div>

        <div class="footer-text" id="footerText">© 2026 Sistem Pengurusan Staf</div>
    </div>

    <!-- ========== AUTH OVERLAY ========== -->
    <div class="auth-overlay hidden" id="authOverlay">
        <div class="auth-box">
            <h3>🔐 Akses Dilindungi</h3>
            <p style="text-align:center; color:#718096; margin-bottom:16px; font-size:14px;" id="authSub">Sila log masuk untuk mengakses halaman ini</p>
            <div class="form-group">
                <label id="authUserLabel">Username</label>
                <input type="text" id="overlayUsername" placeholder="Masukkan username" value="SIANGSIANG">
            </div>
            <div class="form-group">
                <label id="authPassLabel">Password</label>
                <input type="password" id="overlayPassword" placeholder="Masukkan password">
            </div>
            <button class="btn btn-primary" onclick="authenticateOverlay()" id="authLoginBtn">🔓 Log Masuk</button>
            <button class="btn btn-gray" onclick="closeOverlay()" id="authCancelBtn">Batal</button>
            <div class="error-msg" id="overlayError">Username atau Password salah!</div>
        </div>
    </div>

    <script>
        // ============= CONFIG =============
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwMwpE6zvWupu3H-0R333JqQqb3aVIprNJHjY8BgxDdtRLZoO0pXyPvzMhucTlzS85YIQ/exec';
        
        // ============= GET BASE PATH =============
        function getBasePath() {
            // 修复：硬编码路径，因为你的部署在 .github.io 子目录下
            // 这样无论在哪里访问，都能正确跳转
            return '/.github.io/';
        }

        let currentLanguage = 'ms';
        let pendingNavigation = null;

        // ============= TRANSLATIONS =============
        const translations = {
            ms: {
                title: 'Sistem Pengurusan Staf',
                subtitle: 'Pilih menu di bawah untuk navigasi',
                signlog: '📝 Daftar / Log Masuk',
                staffInfo: '📇 Staff Info',
                punch: '🕐 Punch Card Record',
                menu1: '📁 Menu 1',
                menu2: '📁 Menu 2',
                menu3: '📁 Menu 3',
                footer: '© 2026 Sistem Pengurusan Staf',
                authTitle: '🔐 Akses Dilindungi',
                authSub: 'Sila log masuk untuk mengakses halaman ini',
                authUser: 'Username',
                authPass: 'Password',
                authLogin: '🔓 Log Masuk',
                authCancel: 'Batal',
                authError: 'Username atau Password salah!',
                authRequired: 'Sila masukkan username dan password',
                connecting: '🔌 Menyambung...',
                connected: '✅ Bersambung!',
                connectionFail: '❌ Sambungan gagal: ',
                protectedAccess: '🔒 Akses dilindungi. Sila log masuk.',
            },
            en: {
                title: 'Staff Management System',
                subtitle: 'Select a menu below to navigate',
                signlog: '📝 Sign Up / Login',
                staffInfo: '📇 Staff Info',
                punch: '🕐 Punch Card Record',
                menu1: '📁 Menu 1',
                menu2: '📁 Menu 2',
                menu3: '📁 Menu 3',
                footer: '© 2026 Staff Management System',
                authTitle: '🔐 Protected Access',
                authSub: 'Please login to access this page',
                authUser: 'Username',
                authPass: 'Password',
                authLogin: '🔓 Login',
                authCancel: 'Cancel',
                authError: 'Incorrect username or password!',
                authRequired: 'Please enter username and password',
                connecting: '🔌 Connecting...',
                connected: '✅ Connected!',
                connectionFail: '❌ Connection failed: ',
                protectedAccess: '🔒 Protected access. Please login.',
            },
            zh: {
                title: '员工管理系统',
                subtitle: '选择下方菜单进行导航',
                signlog: '📝 注册 / 登录',
                staffInfo: '📇 员工信息',
                punch: '🕐 打卡记录',
                menu1: '📁 菜单 1',
                menu2: '📁 菜单 2',
                menu3: '📁 菜单 3',
                footer: '© 2026 员工管理系统',
                authTitle: '🔐 受保护访问',
                authSub: '请登录以访问此页面',
                authUser: '用户名',
                authPass: '密码',
                authLogin: '🔓 登录',
                authCancel: '取消',
                authError: '用户名或密码错误！',
                authRequired: '请输入用户名和密码',
                connecting: '🔌 连接中...',
                connected: '✅ 已连接！',
                connectionFail: '❌ 连接失败：',
                protectedAccess: '🔒 受保护访问，请登录。',
            }
        };

        function t(key) {
            return translations[currentLanguage]?.[key] || key;
        }

        // ============= LANGUAGE =============
        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === lang);
            });
            updateAllTexts();
        }

        function updateAllTexts() {
            document.getElementById('mainTitle').textContent = t('title');
            document.getElementById('subtitle').textContent = t('subtitle');
            document.getElementById('menuSignLog').textContent = t('signlog');
            document.getElementById('menuStaffInfo').textContent = t('staffInfo');
            document.getElementById('menuPunch').textContent = t('punch');
            document.getElementById('menu1').textContent = t('menu1');
            document.getElementById('menu2').textContent = t('menu2');
            document.getElementById('menu3').textContent = t('menu3');
            document.getElementById('footerText').textContent = t('footer');
            
            // Auth overlay
            document.querySelector('#authOverlay h3').textContent = t('authTitle');
            document.getElementById('authSub').textContent = t('authSub');
            document.getElementById('authUserLabel').textContent = t('authUser');
            document.getElementById('authPassLabel').textContent = t('authPass');
            document.getElementById('authLoginBtn').textContent = t('authLogin');
            document.getElementById('authCancelBtn').textContent = t('authCancel');
        }

        // ============= STATUS =============
        function updateStatus(msg, type = '') {
            const el = document.getElementById('statusBar');
            el.textContent = msg;
            el.className = 'status-bar ' + type;
        }

        function showAlert(msg, type = 'info') {
            const statusBar = document.getElementById('statusBar');
            statusBar.textContent = msg;
            statusBar.className = 'status-bar ' + type;
            setTimeout(() => {
                if (type !== 'error') {
                    updateStatus(t('connected'), 'success');
                }
            }, 4000);
        }

        // ============= CONNECTION TEST =============
        function testConnection() {
            updateStatus(t('connecting'));
            
            fetch(SCRIPT_URL + '?action=getData')
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(data => {
                const count = data.length || 0;
                updateStatus(t('connected') + ' ' + count + ' rekod ditemui.', 'success');
                console.log('✅ Connection successful. Data:', data);
            })
            .catch(err => {
                updateStatus(t('connectionFail') + err.message, 'error');
                console.error('❌ Connection error:', err);
            });
        }

        // ============= NAVIGATION =============
        function navigateTo(page) {
            console.log('🔍 Navigating to:', page);
            console.log('📍 Current URL:', window.location.href);
            
            const basePath = getBasePath();
            console.log('📁 Base path:', basePath);

            // 需要直接跳转的页面（不需要认证）
            if (page === 'signlog') {
                console.log('➡️ Redirecting to signlog page');
                const targetUrl = basePath + 'signlog.html';
                console.log('📍 Full URL:', targetUrl);
                window.location.href = targetUrl;
                return;
            }

            // Staff Info - 需要认证
            if (page === 'staffinfo') {
                console.log('🔒 Staff info - showing auth overlay');
                pendingNavigation = 'staffinfo';
                showAuthOverlay();
                return;
            }

            // Punch Card Record - 需要认证
            if (page === 'punch') {
                console.log('🔒 Punch - showing auth overlay');
                pendingNavigation = 'punch';
                showAuthOverlay();
                return;
            }

            // 其他受保护的页面
            console.log('🔒 Other protected page:', page);
            pendingNavigation = page;
            showAuthOverlay();
        }

        // ============= AUTH OVERLAY =============
        function showAuthOverlay() {
            const overlay = document.getElementById('authOverlay');
            overlay.classList.add('show');
            document.getElementById('overlayUsername').value = 'SIANGSIANG';
            document.getElementById('overlayPassword').value = '';
            document.getElementById('overlayError').style.display = 'none';
            document.getElementById('overlayPassword').focus();
        }

        function closeOverlay() {
            document.getElementById('authOverlay').classList.remove('show');
            pendingNavigation = null;
        }

        function authenticateOverlay() {
            const username = document.getElementById('overlayUsername').value.trim();
            const password = document.getElementById('overlayPassword').value.trim();

            console.log('🔐 Authentication attempt for:', username);

            if (!username || !password) {
                document.getElementById('overlayError').textContent = t('authRequired');
                document.getElementById('overlayError').style.display = 'block';
                return;
            }

            if (username === 'SIANGSIANG' && password === '0000') {
                console.log('✅ Authentication successful!');
                document.getElementById('overlayError').style.display = 'none';
                closeOverlay();
                
                if (pendingNavigation) {
                    console.log('➡️ Navigating to:', pendingNavigation);
                    const basePath = getBasePath();
                    const targetUrl = basePath + pendingNavigation + '.html';
                    console.log('📍 Redirecting to:', targetUrl);
                    window.location.href = targetUrl;
                    pendingNavigation = null;
                }
            } else {
                console.log('❌ Authentication failed!');
                document.getElementById('overlayError').textContent = t('authError');
                document.getElementById('overlayError').style.display = 'block';
                document.getElementById('overlayPassword').value = '';
                document.getElementById('overlayPassword').focus();
            }
        }

        // ============= KEYBOARD EVENTS =============
        document.getElementById('overlayPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                authenticateOverlay();
            }
        });
        document.getElementById('overlayUsername').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('overlayPassword').focus();
            }
        });

        // ============= CLOSE OVERLAY ON BACKDROP CLICK =============
        document.getElementById('authOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeOverlay();
            }
        });

        // ============= INIT =============
        window.addEventListener('load', function() {
            console.log('🚀 Index (Menu) loaded');
            console.log('🔒 Protected pages require login: SIANGSIANG / 0000');
            console.log('📌 Base path:', getBasePath());
            console.log('📍 Current URL:', window.location.href);
            
            setTimeout(testConnection, 500);
            setLanguage('ms');
        });

        // Console helper for debugging
        console.log('💡 Tip: Type "getBasePath()" to see the base path');
        console.log('💡 Tip: Type "window.location.href" to see current URL');
    </script>
</body>
</html>
