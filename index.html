<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Sistem Pengurusan Staf</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 20px 16px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        h1, h2 {
            text-align: center;
            color: #1a3a5c;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .lang-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .lang-btn {
            padding: 8px 18px;
            border: 2px solid #1a3a5c;
            background: transparent;
            color: #1a3a5c;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        .lang-btn.active, .lang-btn:hover {
            background: #1a3a5c;
            color: white;
        }
        .auth-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 16px 0 20px;
            flex-wrap: wrap;
        }
        .auth-btn {
            padding: 12px 32px;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            background: #e2e8f0;
            color: #1a3a5c;
            flex: 1 1 auto;
            min-width: 120px;
        }
        .auth-btn.primary {
            background: #1a3a5c;
            color: white;
        }
        .auth-btn.primary:hover {
            background: #0f2a44;
            transform: scale(1.02);
        }
        .auth-btn.secondary {
            background: #d4a373;
            color: white;
        }
        .auth-btn.secondary:hover {
            background: #b8834f;
            transform: scale(1.02);
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.2s;
            background: #fafcfd;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #1a3a5c;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,58,92,0.15);
        }
        .form-group input:read-only {
            background: #f7fafc;
            cursor: not-allowed;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #1a3a5c;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background: #0f2a44;
            transform: scale(1.01);
        }
        .btn-submit:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        .hidden {
            display: none !important;
        }
        .alert {
            background: #fed7d7;
            color: #9b2c2c;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-weight: 500;
            display: none;
        }
        .alert.show {
            display: block;
        }
        .edit-indicator {
            background: #e6fffa;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 13px;
            color: #234e52;
            display: inline-block;
            margin-bottom: 12px;
        }
        .field-required::after {
            content: " *";
            color: #e53e3e;
            font-weight: 700;
        }
        @media (max-width: 480px) {
            .two-col {
                grid-template-columns: 1fr;
            }
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #b0c4de;
            border-radius: 10px;
        }
        .time-picker-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .time-picker-row select, .time-picker-row input {
            flex: 1;
            min-width: 80px;
        }
        .time-picker-row span {
            font-weight: 600;
            color: #4a5568;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a3a5c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-submit:disabled {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container" id="appContainer">
        <h1 id="mainTitle">Sistem Pengurusan Staf</h1>

        <!-- Language Bar -->
        <div class="lang-bar">
            <button class="lang-btn active" data-lang="ms" onclick="setLanguage('ms')">Bahasa Melayu</button>
            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" data-lang="zh" onclick="setLanguage('zh')">中文</button>
        </div>

        <!-- Auth Section -->
        <div class="auth-section" id="authSection">
            <button class="auth-btn primary" id="signupBtn" onclick="showSignup()">📝 Daftar</button>
            <button class="auth-btn secondary" id="loginBtn" onclick="showLogin()">🔑 Log Masuk</button>
        </div>

        <!-- Alert Box -->
        <div class="alert" id="alertBox"></div>

        <!-- ========== SIGNUP FORM ========== -->
        <div id="signupForm" class="hidden">
            <h2 id="signupTitle">📋 Daftar Staf Baru</h2>
            <form id="staffForm" onsubmit="submitSignup(event)">
                <!-- Group Name - 改为选项 -->
                <div class="form-group">
                    <label class="field-required" id="lblGroupName">Group Name</label>
                    <select id="GroupName" required onchange="handleGroupChange()">
                        <option value="">-- Sila Pilih --</option>
                        <option value="SIANG SIANG RESTAURANT(BANDAR)">SIANG SIANG RESTAURANT (BANDAR)</option>
                        <option value="SIANG SIANG RESTAURANT(BATU 4)">SIANG SIANG RESTAURANT (BATU 4)</option>
                        <option value="YZ UFO">YZ UFO</option>
                        <option value="YZ CYBER CAFE(BANDAR)">YZ CYBER CAFE (BANDAR)</option>
                        <option value="YZ CYBER CAFE(SEJATI)">YZ CYBER CAFE (SEJATI)</option>
                        <option value="CC TELESHOP (KIMFUNG)">CC TELESHOP (KIMFUNG)</option>
                        <option value="CC TELESHOP (MESRA)">CC TELESHOP (MESRA)</option>
                        <option value="Others">Others (Lain-lain)</option>
                    </select>
                    <div id="otherGroupContainer" class="hidden" style="margin-top:8px;">
                        <input type="text" id="OtherGroupInput" placeholder="Sila nyatakan kumpulan lain" oninput="syncOtherGroup()">
                    </div>
                </div>

                <!-- Code -->
                <div class="form-group">
                    <label class="field-required" id="lblCode">Code</label>
                    <input type="text" id="Code" placeholder="Kod Unik" required>
                </div>

                <!-- Name -->
                <div class="form-group">
                    <label class="field-required" id="lblName">Name</label>
                    <input type="text" id="Name" placeholder="Nama Penuh" required>
                </div>

                <!-- Jantina -->
                <div class="form-group">
                    <label class="field-required" id="lblJantina">Jantina</label>
                    <select id="Jantina" required>
                        <option value="">-- Sila Pilih --</option>
                        <option value="Lelaki">Lelaki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <!-- Tarikh Lahir -->
                <div class="form-group">
                    <label class="field-required" id="lblTarikhLahir">Tarikh Lahir</label>
                    <input type="date" id="TarikhLahir" required>
                </div>

                <!-- Salary -->
                <div class="form-group">
                    <label class="field-required" id="lblSalary">Salary</label>
                    <input type="number" id="Salary" placeholder="Gaji" required>
                </div>

                <!-- IC/Passport -->
                <div class="form-group">
                    <label class="field-required" id="lblIC">IC/Passport/Doc.No</label>
                    <input type="text" id="IC" placeholder="No. KP/Passport" required>
                </div>

                <!-- Jawatan -->
                <div class="form-group">
                    <label class="field-required" id="lblJawatan">Jawatan</label>
                    <input type="text" id="Jawatan" placeholder="Jawatan" required>
                </div>

                <!-- Tarikh Masuk Kerja -->
                <div class="form-group">
                    <label class="field-required" id="lblTarikhMasuk">Tarikh Masuk Kerja</label>
                    <input type="date" id="TarikhMasukKerja" required>
                </div>

                <!-- Telefon -->
                <div class="form-group">
                    <label class="field-required" id="lblTelefon">Telefon No.</label>
                    <input type="tel" id="TelefonNo" placeholder="012-3456789" required>
                </div>

                <!-- Email - 非必填 -->
                <div class="form-group">
                    <label id="lblEmail">Email</label>
                    <input type="email" id="Email" placeholder="email@contoh.com">
                </div>

                <!-- Shift Type - 改为选项 + 自定义时间 -->
                <div class="form-group">
                    <label class="field-required" id="lblShiftType">Shift Type</label>
                    <select id="ShiftType" required onchange="handleShiftChange()">
                        <option value="">-- Sila Pilih --</option>
                        <option value="6AM-2.30PM">6AM - 2.30PM</option>
                        <option value="8AM-4.30PM">8AM - 4.30PM</option>
                        <option value="2PM-10.30PM">2PM - 10.30PM</option>
                        <option value="3.30PM-11.00PM">3.30PM - 11.00PM</option>
                        <option value="Others">Others (Lain-lain)</option>
                    </select>
                    <div id="otherShiftContainer" class="hidden" style="margin-top:8px;">
                        <div class="time-picker-row">
                            <select id="ShiftStartAMPM">
                                <option value="AM">AM</option>
                                <option value="PM">PM</option>
                            </select>
                            <input type="number" id="ShiftStartHour" placeholder="Jam" min="1" max="12" style="width:70px;">
                            <span>:</span>
                            <input type="number" id="ShiftStartMin" placeholder="Min" min="0" max="59" style="width:70px;">
                            <span>→</span>
                            <select id="ShiftEndAMPM">
                                <option value="AM">AM</option>
                                <option value="PM" selected>PM</option>
                            </select>
                            <input type="number" id="ShiftEndHour" placeholder="Jam" min="1" max="12" style="width:70px;">
                            <span>:</span>
                            <input type="number" id="ShiftEndMin" placeholder="Min" min="0" max="59" style="width:70px;">
                        </div>
                        <input type="hidden" id="OtherShiftFull">
                    </div>
                </div>

                <!-- Off Day - 改为选项 星期一到星期日 -->
                <div class="form-group">
                    <label class="field-required" id="lblOffDay">Off Day</label>
                    <select id="OffDay" required>
                        <option value="">-- Sila Pilih --</option>
                        <option value="Isnin">Isnin (Monday)</option>
                        <option value="Selasa">Selasa (Tuesday)</option>
                        <option value="Rabu">Rabu (Wednesday)</option>
                        <option value="Khamis">Khamis (Thursday)</option>
                        <option value="Jumaat">Jumaat (Friday)</option>
                        <option value="Sabtu">Sabtu (Saturday)</option>
                        <option value="Ahad">Ahad (Sunday)</option>
                    </select>
                </div>

                <!-- Alamat Tetap -->
                <div class="form-group">
                    <label class="field-required" id="lblAlamatTetap">Alamat Tetap</label>
                    <input type="text" id="AlamatTetap" placeholder="Alamat Rumah" required>
                </div>

                <!-- Nama Waris - 非必填 -->
                <div class="form-group">
                    <label id="lblNamaWaris">Nama Waris</label>
                    <input type="text" id="NamaWaris" placeholder="Nama Waris">
                </div>

                <!-- Alamat Waris - 非必填 -->
                <div class="form-group">
                    <label id="lblAlamatWaris">Alamat Waris</label>
                    <input type="text" id="AlamatWaris" placeholder="Alamat Waris">
                </div>

                <!-- Bank Nama -->
                <div class="form-group">
                    <label class="field-required" id="lblBankNama">Bank Nama</label>
                    <select id="BankNama" required onchange="handleBankChange()">
                        <option value="">-- Pilih Bank --</option>
                        <option value="AGRO BANK">AGRO BANK</option>
                        <option value="AMBANK">AMBANK</option>
                        <option value="BANK ISLAM">BANK ISLAM</option>
                        <option value="BANK MUAMALAT">BANK MUAMALAT</option>
                        <option value="BSN">BSN</option>
                        <option value="CASH">CASH</option>
                        <option value="CIMB BAMK">CIMB BAMK</option>
                        <option value="HONG LEONG BANK">HONG LEONG BANK</option>
                        <option value="MAYBANK">MAYBANK</option>
                        <option value="MECHANTRADE">MECHANTRADE</option>
                        <option value="PUBLIC BANK(PBB)">PUBLIC BANK (PBB)</option>
                        <option value="RHB BANK">RHB BANK</option>
                        <option value="Others">Others (Lain-lain)</option>
                    </select>
                    <div id="otherBankContainer" class="hidden" style="margin-top:8px;">
                        <input type="text" id="OtherBankInput" placeholder="Sila nyatakan bank lain" oninput="syncOtherBank()">
                    </div>
                </div>

                <!-- Bank Account -->
                <div class="form-group">
                    <label class="field-required" id="lblBankAccount">Bank Account No.</label>
                    <input type="text" id="BankAccountNo" placeholder="No. Akaun" required>
                </div>

                <!-- EPF -->
                <div class="form-group">
                    <label class="field-required" id="lblEPF">EPF (kwsp) No.</label>
                    <input type="text" id="EPF" placeholder="No. KWSP" required>
                </div>

                <!-- PERKESO -->
                <div class="form-group">
                    <label class="field-required" id="lblPERKESO">PERKESO NO.</label>
                    <input type="text" id="PERKESO" placeholder="No. PERKESO" required>
                </div>

                <!-- EIS -->
                <div class="form-group">
                    <label class="field-required" id="lblEIS">EIS NO.</label>
                    <input type="text" id="EIS" placeholder="No. EIS" required>
                </div>

                <!-- 24Jam Lindungan -->
                <div class="form-group">
                    <label class="field-required" id="lbl24Jam">24Jam Lindungan</label>
                    <select id="Lindungan" required>
                        <option value="">-- Pilih --</option>
                        <option value="YES">YES</option>
                        <option value="NO">NO</option>
                    </select>
                </div>

                <!-- Yellow Card -->
                <div class="form-group">
                    <label class="field-required" id="lblYellowCard">Kad Kebersihan (Yellow Card)</label>
                    <select id="YellowCard" required>
                        <option value="">-- Pilih --</option>
                        <option value="YES">YES</option>
                        <option value="NO">NO</option>
                    </select>
                </div>

                <!-- Phone Type -->
                <div class="form-group">
                    <label class="field-required" id="lblPhoneType">Phone type</label>
                    <input type="text" id="PhoneType" placeholder="Contoh: Android" required>
                </div>

                <!-- Login Password -->
                <div class="form-group">
                    <label class="field-required" id="lblLoginPassword">Login Password</label>
                    <input type="password" id="LoginPassword" placeholder="Kata Laluan" required>
                </div>

                <!-- Hidden fields: Situation, Holidays akan diisi default di backend -->
                <input type="hidden" id="SignupDate" value="">
                <input type="hidden" id="UpdateDate" value="">
                <input type="hidden" id="AgreementSituation" value="Default">

                <button type="submit" class="btn-submit" id="signupSubmitBtn">📤 Daftar</button>
            </form>
        </div>

        <!-- ========== LOGIN FORM ========== -->
        <div id="loginForm" class="hidden">
            <h2 id="loginTitle">🔐 Log Masuk</h2>
            <div class="form-group">
                <label class="field-required" id="lblLoginCode">Code</label>
                <input type="text" id="loginCode" placeholder="Masukkan Code">
            </div>
            <div class="form-group">
                <label class="field-required" id="lblLoginPassword2">Password</label>
                <input type="password" id="loginPassword" placeholder="Kata Laluan">
            </div>
            <button class="btn-submit" id="loginSubmitBtn" onclick="performLogin()">🔓 Log Masuk</button>
            <div id="loginResult" style="margin-top:12px; font-weight:600;"></div>
        </div>

        <!-- ========== PROFILE / EDIT VIEW ========== -->
        <div id="profileView" class="hidden">
            <h2 id="profileTitle">👤 Profil Staf</h2>
            <div class="edit-indicator" id="editIndicator">✏️ Klik pada mana-mana medan untuk sunting</div>
            <div id="profileFields"></div>
            <button class="btn-submit" onclick="logout()" style="background:#c53030;">🚪 Log Keluar</button>
        </div>
    </div>

                saveSuccess: '数据保存成功。', saveFail: '保存数据出错。',
                confirmLogout: '您确定要退出登录吗？',
                noData: '暂无数据，请先注册。',
                networkError: '网络错误，请确保 Apps Script 已部署。',
                registering: '注册中...',
                loggingIn: '登录中...',
            }
        };

        function t(key) { return langMap[currentLanguage]?.[key] || key; }

        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
            document.getElementById('mainTitle').textContent = t('title');
            document.getElementById('signupBtn').textContent = t('signup');
            document.getElementById('loginBtn').textContent = t('login');
            document.getElementById('signupTitle').textContent = t('signupTitle');
            document.getElementById('loginTitle').textContent = t('loginTitle');
            document.getElementById('profileTitle').textContent = t('profileTitle');
            document.getElementById('editIndicator').textContent = t('editHint');
            document.querySelector('#profileView .btn-submit').textContent = t('logout');
            document.getElementById('signupSubmitBtn').textContent = t('submit');
            document.getElementById('loginSubmitBtn').textContent = t('loginBtn');
            
            const labelMap = {
                'lblGroupName':'GroupName','lblCode':'Code','lblName':'Name','lblJantina':'Jantina',
                'lblTarikhLahir':'TarikhLahir','lblSalary':'Salary','lblIC':'IC','lblJawatan':'Jawatan',
                'lblTarikhMasuk':'TarikhMasuk','lblTelefon':'Telefon','lblEmail':'Email',
                'lblShiftType':'ShiftType','lblOffDay':'OffDay','lblAlamatTetap':'AlamatTetap',
                'lblNamaWaris':'NamaWaris','lblAlamatWaris':'AlamatWaris','lblBankNama':'BankNama',
                'lblBankAccount':'BankAccount','lblEPF':'EPF','lblPERKESO':'PERKESO','lblEIS':'EIS',
                'lbl24Jam':'24Jam','lblYellowCard':'YellowCard','lblPhoneType':'PhoneType',
                'lblLoginPassword':'LoginPassword','lblLoginCode':'loginCode','lblLoginPassword2':'loginPassword'
            };
            for (let [id, key] of Object.entries(labelMap)) {
                const el = document.getElementById(id);
                if (el) el.textContent = t(key) + (el.classList.contains('field-required') ? ' *' : '');
            }
        }

        // ============= UI HELPERS =============
        function showAlert(msg, isError = true) {
            const box = document.getElementById('alertBox');
            box.textContent = msg;
            box.style.display = 'block';
            box.style.background = isError ? '#fed7d7' : '#c6f6d5';
            box.style.color = isError ? '#9b2c2c' : '#22543d';
            setTimeout(() => { box.style.display = 'none'; }, 5000);
        }

        function showSignup() {
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('profileView').classList.add('hidden');
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('signupForm').scrollIntoView({ behavior: 'smooth' });
        }

        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('profileView').classList.add('hidden');
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('loginForm').scrollIntoView({ behavior: 'smooth' });
        }

        function logout() {
            if (!confirm(t('confirmLogout'))) return;
            currentUser = null;
            document.getElementById('profileView').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginResult').textContent = '';
        }

        function setLoading(buttonId, isLoading, loadingText) {
            const btn = document.getElementById(buttonId);
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<span class="loading-spinner"></span>${loadingText}`;
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.originalText || btn.textContent;
            }
        }

        // ============= GROUP HANDLING =============
        function handleGroupChange() {
            const sel = document.getElementById('GroupName');
            const container = document.getElementById('otherGroupContainer');
            if (sel.value === 'Others') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
                document.getElementById('OtherGroupInput').value = '';
            }
        }
        function syncOtherGroup() {}

        // ============= SHIFT HANDLING =============
        function handleShiftChange() {
            const sel = document.getElementById('ShiftType');
            const container = document.getElementById('otherShiftContainer');
            if (sel.value === 'Others') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function getShiftValue() {
            const sel = document.getElementById('ShiftType');
            if (sel.value !== 'Others') return sel.value;
            const startAMPM = document.getElementById('ShiftStartAMPM').value;
            const startH = document.getElementById('ShiftStartHour').value.padStart(2, '0');
            const startM = document.getElementById('ShiftStartMin').value.padStart(2, '0');
            const endAMPM = document.getElementById('ShiftEndAMPM').value;
            const endH = document.getElementById('ShiftEndHour').value.padStart(2, '0');
            const endM = document.getElementById('ShiftEndMin').value.padStart(2, '0');
            if (startH && startM && endH && endM) {
                return `${startH}:${startM}${startAMPM} - ${endH}:${endM}${endAMPM}`;
            }
            return 'Others';
        }

        // ============= BANK HANDLING =============
        function handleBankChange() {
            const bank = document.getElementById('BankNama').value;
            const otherContainer = document.getElementById('otherBankContainer');
            const accInput = document.getElementById('BankAccountNo');
            if (bank === 'CASH' || bank === 'MECHANTRADE') {
                accInput.value = '-';
                accInput.readOnly = true;
                accInput.required = false;
            } else {
                accInput.readOnly = false;
                accInput.required = true;
                if (accInput.value === '-') accInput.value = '';
            }
            if (bank === 'Others') {
                otherContainer.classList.remove('hidden');
            } else {
                otherContainer.classList.add('hidden');
                document.getElementById('OtherBankInput').value = '';
            }
        }
        function syncOtherBank() {}

        // ============= SUBMIT SIGNUP =============
        function submitSignup(e) {
            e.preventDefault();
            
            const requiredIds = ['GroupName','Code','Name','Jantina','TarikhLahir','Salary','IC',
                'Jawatan','TarikhMasukKerja','TelefonNo','ShiftType','OffDay','AlamatTetap',
                'BankNama','BankAccountNo','EPF','PERKESO','EIS','Lindungan','YellowCard',
                'PhoneType','LoginPassword'];
            
            for (let id of requiredIds) {
                const el = document.getElementById(id);
                if (!el || !el.value.trim()) {
                    showAlert(t('required'));
                    el.focus();
                    return;
                }
            }
            
            // Group Others
            let groupVal = document.getElementById('GroupName').value;
            if (groupVal === 'Others') {
                const other = document.getElementById('OtherGroupInput').value.trim();
                if (!other) { showAlert('Sila nyatakan kumpulan lain / Please specify other group'); return; }
                groupVal = other;
            }
            
            // Bank Others
            let bankVal = document.getElementById('BankNama').value;
            if (bankVal === 'Others') {
                const other = document.getElementById('OtherBankInput').value.trim();
                if (!other) { showAlert('Sila nyatakan bank lain / Please specify other bank'); return; }
                bankVal = other;
            }
            
            // Shift
            const shiftVal = getShiftValue();

            const data = {
                GroupName: groupVal,
                Code: document.getElementById('Code').value.trim(),
                Name: document.getElementById('Name').value.trim(),
                Jantina: document.getElementById('Jantina').value,
                TarikhLahir: document.getElementById('TarikhLahir').value,
                Salary: document.getElementById('Salary').value.trim(),
                IC: document.getElementById('IC').value.trim(),
                Jawatan: document.getElementById('Jawatan').value.trim(),
                TarikhMasukKerja: document.getElementById('TarikhMasukKerja').value,
                TelefonNo: document.getElementById('TelefonNo').value.trim(),
                Email: document.getElementById('Email').value.trim(),
                ShiftType: shiftVal,
                OffDay: document.getElementById('OffDay').value,
                AlamatTetap: document.getElementById('AlamatTetap').value.trim(),
                NamaWaris: document.getElementById('NamaWaris').value.trim(),
                AlamatWaris: document.getElementById('AlamatWaris').value.trim(),
                BankNama: bankVal,
                BankAccountNo: document.getElementById('BankAccountNo').value.trim(),
                EPF: document.getElementById('EPF').value.trim(),
                PERKESO: document.getElementById('PERKESO').value.trim(),
                EIS: document.getElementById('EIS').value.trim(),
                Lindungan: document.getElementById('Lindungan').value,
                YellowCard: document.getElementById('YellowCard').value,
                PhoneType: document.getElementById('PhoneType').value.trim(),
                LoginPassword: document.getElementById('LoginPassword').value.trim(),
                SignupDate: new Date().toISOString(),
                UpdateDate: new Date().toISOString(),
                AgreementSituation: 'Default',
            };

            // Set loading state
            const submitBtn = document.getElementById('signupSubmitBtn');
            submitBtn.dataset.originalText = submitBtn.textContent;
            setLoading('signupSubmitBtn', true, t('registering'));

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(data)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok: ' + response.status);
                }
                return response.json();
            })
            .then(result => {
                setLoading('signupSubmitBtn', false);
                if (result.result === 'success') {
                    showAlert('Pendaftaran berjaya! / Registration successful!', false);
                    document.getElementById('staffForm').reset();
                    document.getElementById('BankAccountNo').readOnly = false;
                    document.getElementById('BankAccountNo').required = true;
                    document.getElementById('otherBankContainer').classList.add('hidden');
                    document.getElementById('otherGroupContainer').classList.add('hidden');
                    document.getElementById('otherShiftContainer').classList.add('hidden');
                    setTimeout(() => showLogin(), 1500);
                } else {
                    showAlert('Ralat: ' + (result.error || 'Unknown error'));
                }
            })
            .catch(err => {
                setLoading('signupSubmitBtn', false);
                showAlert(t('networkError') + ': ' + err.message);
            });
        }

        // ============= LOGIN =============
        function performLogin() {
            const code = document.getElementById('loginCode').value.trim();
            const pwd = document.getElementById('loginPassword').value.trim();
            
            if (!code || !pwd) {
                showAlert('Sila masukkan Code dan Password.');
                return;
            }
            
            const loginBtn = document.getElementById('loginSubmitBtn');
            loginBtn.dataset.originalText = loginBtn.textContent;
            setLoading('loginSubmitBtn', true, t('loggingIn'));

            fetch(SCRIPT_URL + '?action=getData')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                setLoading('loginSubmitBtn', false);
                
                if (data.error) {
                    showAlert('Ralat: ' + data.error);
                    return;
                }
                
                if (!data || !data.length) {
                    showAlert(t('noData'));
                    return;
                }
                
                const user = data.find(row => row.Code === code && row.LoginPassword === pwd);
                if (user) {
                    currentUser = user;
                    showAlert(t('loginSuccess'), false);
                    displayProfile(user);
                } else {
                    showAlert(t('loginFail'));
                }
            })
            .catch(err => {
                setLoading('loginSubmitBtn', false);
                showAlert(t('networkError') + ': ' + err.message);
            });
        }

        // ============= DISPLAY PROFILE =============
        function displayProfile(user) {
            document.getElementById('profileView').classList.remove('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('authSection').classList.add('hidden');
            
            const container = document.getElementById('profileFields');
            container.innerHTML = '';
            
            const fields = [
                'GroupName','Code','Name','Jantina','TarikhLahir','Salary','IC','Jawatan',
                'TarikhMasukKerja','TelefonNo','Email','ShiftType','OffDay','AlamatTetap',
                'NamaWaris','AlamatWaris','BankNama','BankAccountNo','EPF','PERKESO','EIS',
                'Lindungan','YellowCard','PhoneType','LoginPassword','SignupDate','UpdateDate'
            ];
            
            const labelMap = {
                GroupName:'Group Name', Code:'Code', Name:'Name', Jantina:'Jantina',
                TarikhLahir:'Tarikh Lahir', Salary:'Salary', IC:'IC/Passport/Doc.No',
                Jawatan:'Jawatan', TarikhMasukKerja:'Tarikh Masuk Kerja',
                TelefonNo:'Telefon No.', Email:'Email', ShiftType:'Shift Type',
                OffDay:'Off Day', AlamatTetap:'Alamat Tetap', NamaWaris:'Nama Waris',
                AlamatWaris:'Alamat Waris', BankNama:'Bank Nama', BankAccountNo:'Bank Account No.',
                EPF:'EPF (kwsp) No.', PERKESO:'PERKESO NO.', EIS:'EIS NO.',
                Lindungan:'24Jam Lindungan', YellowCard:'Kad Kebersihan (Yellow Card)',
                PhoneType:'Phone type', LoginPassword:'Login Password',
                SignupDate:'Signup Date', UpdateDate:'Update Date'
            };

            for (let key of fields) {
                const val = user[key] || '';
                const div = document.createElement('div');
                div.className = 'form-group';
                const label = document.createElement('label');
                label.textContent = (labelMap[key] || key) + ':';
                const input = document.createElement('input');
                input.type = (key === 'LoginPassword') ? 'password' : 'text';
                input.value = val;
                input.dataset.field = key;
                input.id = 'prof_' + key;
                input.addEventListener('change', function() {
                    currentUser[key] = this.value;
                    currentUser.UpdateDate = new Date().toISOString();
                    saveProfile();
                });
                div.appendChild(label);
                div.appendChild(input);
                container.appendChild(div);
            }
            document.getElementById('profileView').scrollIntoView({ behavior: 'smooth' });
        }

        function saveProfile() {
            if (!currentUser || !currentUser.Code) return;
            
            const payload = {
                action: 'update',
                ...currentUser
            };
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(payload)
            })
            .then(response => response.json())
            .then(result => {
                if (result.result === 'success') {
                    showAlert(t('saveSuccess'), false);
                } else {
                    showAlert(t('saveFail') + ': ' + (result.message || ''));
                }
            })
            .catch(err => {
                showAlert(t('saveFail') + ': ' + err.message);
            });
        }

        // ============= INIT =============
        setLanguage('ms');
        
        // Test connection on load
        fetch(SCRIPT_URL + '?action=getData')
        .then(response => response.json())
        .then(data => {
            console.log('Connection successful! Data count:', data.length || 0);
        })
        .catch(err => {
            console.warn('Connection test failed:', err.message);
            // Don't show alert here, let user try login/register first
        });
    </script>
</body>
</html>
