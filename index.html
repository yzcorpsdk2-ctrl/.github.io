<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Sistem Pengurusan Staf</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 20px 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1, h2 { text-align: center; color: #1a3a5c; margin-bottom: 16px; font-size: 24px; }
        h2 { font-size: 20px; }
        
        /* Language Bar */
        .lang-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .lang-btn {
            padding: 6px 16px;
            border: 2px solid #1a3a5c;
            background: transparent;
            color: #1a3a5c;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        .lang-btn.active, .lang-btn:hover {
            background: #1a3a5c;
            color: white;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 8px;
        }
        .btn-primary { background: #1a3a5c; color: white; }
        .btn-primary:hover { background: #0f2a44; }
        .btn-secondary { background: #d4a373; color: white; }
        .btn-secondary:hover { background: #b8834f; }
        .btn-danger { background: #c53030; color: white; }
        .btn-danger:hover { background: #9b2c2c; }
        .btn-success { background: #38a169; color: white; }
        .btn-success:hover { background: #2f855a; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-gray { background: #e2e8f0; color: #4a5568; }
        .btn-gray:hover { background: #cbd5e0; }
        .btn-menu { background: #2b6cb0; color: white; }
        .btn-menu:hover { background: #1a4f8b; }

        .auth-section {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .auth-section .btn { margin-bottom: 0; }

        /* Form */
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #2d3748;
            margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            background: #fafcfd;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #1a3a5c;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,58,92,0.1);
        }
        .form-group input:read-only {
            background: #f7fafc;
        }
        .hidden { display: none !important; }

        /* Alert */
        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
            font-weight: 500;
        }
        .alert.error { background: #fed7d7; color: #9b2c2c; display: block; }
        .alert.success { background: #c6f6d5; color: #22543d; display: block; }
        .alert.info { background: #bee3f8; color: #2a4365; display: block; }

        /* Status Bar */
        .status-bar {
            background: #edf2f7;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: #4a5568;
            margin-bottom: 16px;
            text-align: center;
        }
        .status-bar.success { background: #c6f6d5; color: #22543d; }
        .status-bar.error { background: #fed7d7; color: #9b2c2c; }

        /* Profile */
        .profile-field {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            align-items: center;
            flex-wrap: wrap;
        }
        .profile-field label {
            font-weight: 600;
            color: #4a5568;
            font-size: 13px;
            flex: 0 0 120px;
        }
        .profile-field input {
            border: none;
            text-align: right;
            font-size: 14px;
            background: transparent;
            flex: 1;
            padding: 4px 8px;
            min-width: 100px;
        }
        .profile-field input:focus {
            outline: 2px solid #1a3a5c;
            background: white;
            border-radius: 4px;
        }

        .required-star { color: #e53e3e; }
        .field-required::after { content: " *"; color: #e53e3e; }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a3a5c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .other-input {
            margin-top: 6px;
        }

        /* Menu Styles */
        .menu-section {
            margin-top: 20px;
            border-top: 2px solid #e2e8f0;
            padding-top: 16px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .menu-grid .btn {
            margin-bottom: 0;
            font-size: 14px;
            padding: 14px 8px;
        }
        .menu-title {
            text-align: center;
            color: #1a3a5c;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 16px;
        }

        /* Auth Overlay for protected pages */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .auth-overlay .auth-box {
            background: white;
            padding: 30px 24px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-overlay .auth-box h3 {
            text-align: center;
            color: #1a3a5c;
            margin-bottom: 16px;
        }
        .auth-overlay .auth-box .form-group {
            margin-bottom: 12px;
        }
        .auth-overlay .auth-box .btn {
            margin-top: 8px;
        }
        .auth-overlay .auth-box .error-msg {
            color: #c53030;
            font-size: 14px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }

        @media (max-width: 480px) {
            .container { padding: 16px 12px; }
            .profile-field label { flex: 0 0 90px; font-size: 12px; }
            .profile-field input { font-size: 13px; }
            .lang-btn { font-size: 12px; padding: 4px 12px; }
            .menu-grid { grid-template-columns: 1fr 1fr; }
            .menu-grid .btn { font-size: 12px; padding: 12px 6px; }
        }
        @media (max-width: 380px) {
            .menu-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="mainTitle">👤 Sistem Pengurusan Staf</h1>

        <!-- Language Bar -->
        <div class="lang-bar">
            <button class="lang-btn active" data-lang="ms" onclick="setLanguage('ms')">Bahasa Melayu</button>
            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" data-lang="zh" onclick="setLanguage('zh')">中文</button>
        </div>

        <!-- Status Bar -->
        <div id="statusBar" class="status-bar">🔌 Menyambung...</div>

        <!-- Auth Section -->
        <div class="auth-section" id="authSection">
            <button class="btn btn-primary" id="signupBtn" onclick="showSignup()">📝 Daftar</button>
            <button class="btn btn-secondary" id="loginBtn" onclick="showLogin()">🔑 Log Masuk</button>
        </div>

        <!-- Alert -->
        <div id="alert" class="alert"></div>

        <!-- ========== REGISTER FORM ========== -->
        <div id="signupForm" class="hidden">
            <h2 id="signupTitle">📋 Daftar Staf Baru</h2>
            <form id="registerForm">
                <!-- Group Name -->
                <div class="form-group">
                    <label class="field-required" id="lblGroupName">Group Name</label>
                    <select id="sGroupName" required onchange="handleGroupChange()">
                        <option value="">-- Sila Pilih --</option>
                        <option value="SIANG SIANG RESTAURANT(BANDAR)">SIANG SIANG RESTAURANT (BANDAR)</option>
                        <option value="SIANG SIANG RESTAURANT(BATU 4)">SIANG SIANG RESTAURANT (BATU 4)</option>
                        <option value="YZ UFO">YZ UFO</option>
                        <option value="YZ CYBER CAFE(BANDAR)">YZ CYBER CAFE (BANDAR)</option>
                        <option value="YZ CYBER CAFE(SEJATI)">YZ CYBER CAFE (SEJATI)</option>
                        <option value="CC TELESHOP (KIMFUNG)">CC TELESHOP (KIMFUNG)</option>
                        <option value="CC TELESHOP (MESRA)">CC TELESHOP (MESRA)</option>
                        <option value="Others">Others (Lain-lain)</option>
                    </select>
                    <div id="otherGroupContainer" class="hidden other-input">
                        <input type="text" id="OtherGroupInput" placeholder="Sila nyatakan kumpulan lain">
                    </div>
                </div>

                <!-- Code -->
                <div class="form-group">
                    <label class="field-required" id="lblCode">Code</label>
                    <input type="text" id="sCode" placeholder="Kod Unik" required>
                </div>

                <!-- Name -->
                <div class="form-group">
                    <label class="field-required" id="lblName">Name</label>
                    <input type="text" id="sName" placeholder="Nama Penuh" required>
                </div>

                <!-- Jantina -->
                <div class="form-group">
                    <label class="field-required" id="lblJantina">Jantina</label>
                    <select id="sJantina" required>
                        <option value="">-- Sila Pilih --</option>
                        <option value="Lelaki">Lelaki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <!-- Tarikh Lahir -->
                <div class="form-group">
                    <label class="field-required" id="lblTarikhLahir">Tarikh Lahir</label>
                    <input type="date" id="sTarikhLahir" required>
                </div>

                <!-- Salary -->
                <div class="form-group">
                    <label class="field-required" id="lblSalary">Salary</label>
                    <input type="number" id="sSalary" placeholder="Gaji" required>
                </div>

                <!-- IC -->
                <div class="form-group">
                    <label class="field-required" id="lblIC">IC/Passport/Doc.No</label>
                    <input type="text" id="sIC" placeholder="No. KP/Passport" required>
                </div>

                <!-- Jawatan -->
                <div class="form-group">
                    <label class="field-required" id="lblJawatan">Jawatan</label>
                    <input type="text" id="sJawatan" placeholder="Jawatan" required>
                </div>

                <!-- Tarikh Masuk Kerja -->
                <div class="form-group">
                    <label class="field-required" id="lblTarikhMasuk">Tarikh Masuk Kerja</label>
                    <input type="date" id="sTarikhMasukKerja" required>
                </div>

                <!-- Telefon -->
                <div class="form-group">
                    <label class="field-required" id="lblTelefon">Telefon No.</label>
                    <input type="tel" id="sTelefonNo" placeholder="012-3456789" required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label id="lblEmail">Email</label>
                    <input type="email" id="sEmail" placeholder="email@contoh.com">
                </div>

                <!-- Shift Type -->
                <div class="form-group">
                    <label class="field-required" id="lblShiftType">Shift Type</label>
                    <select id="sShiftType" required onchange="handleShiftChange()">
                        <option value="">-- Sila Pilih --</option>
                        <option value="6AM-2.30PM">6AM - 2.30PM</option>
                        <option value="8AM-4.30PM">8AM - 4.30PM</option>
                        <option value="2PM-10.30PM">2PM - 10.30PM</option>
                        <option value="3.30PM-11.00PM">3.30PM - 11.00PM</option>
                        <option value="Others">Others (Lain-lain)</option>
                    </select>
                    <div id="otherShiftContainer" class="hidden other-input">
                        <input type="text" id="OtherShiftInput" placeholder="Contoh: 9AM-5PM">
                    </div>
                </div>

                <!-- Off Day -->
                <div class="form-group">
                    <label class="field-required" id="lblOffDay">Off Day</label>
                    <select id="sOffDay" required>
                        <option value="">-- Sila Pilih --</option>
                        <option value="Isnin">Isnin (Monday)</option>
                        <option value="Selasa">Selasa (Tuesday)</option>
                        <option value="Rabu">Rabu (Wednesday)</option>
                        <option value="Khamis">Khamis (Thursday)</option>
                        <option value="Jumaat">Jumaat (Friday)</option>
                        <option value="Sabtu">Sabtu (Saturday)</option>
                        <option value="Ahad">Ahad (Sunday)</option>
                    </select>
                </div>

                <!-- Alamat Tetap -->
                <div class="form-group">
                    <label class="field-required" id="lblAlamatTetap">Alamat Tetap</label>
                    <input type="text" id="sAlamatTetap" placeholder="Alamat Rumah" required>
                </div>

                <!-- Nama Waris -->
                <div class="form-group">
                    <label id="lblNamaWaris">Nama Waris</label>
                    <input type="text" id="sNamaWaris" placeholder="Nama Waris">
                </div>

                <!-- Alamat Waris -->
                <div class="form-group">
                    <label id="lblAlamatWaris">Alamat Waris</label>
                    <input type="text" id="sAlamatWaris" placeholder="Alamat Waris">
                </div>

                <!-- Bank Nama -->
                <div class="form-group">
                    <label class="field-required" id="lblBankNama">Bank Nama</label>
                    <select id="sBankNama" required onchange="handleBankChange()">
                        <option value="">-- Pilih Bank --</option>
                        <option value="AGRO BANK">AGRO BANK</option>
                        <option value="AMBANK">AMBANK</option>
                        <option value="BANK ISLAM">BANK ISLAM</option>
                        <option value="BANK MUAMALAT">BANK MUAMALAT</option>
                        <option value="BSN">BSN</option>
                        <option value="CASH">CASH</option>
                        <option value="CIMB BAMK">CIMB BAMK</option>
                        <option value="HONG LEONG BANK">HONG LEONG BANK</option>
                        <option value="MAYBANK">MAYBANK</option>
                        <option value="MECHANTRADE">MECHANTRADE</option>
                        <option value="PUBLIC BANK(PBB)">PUBLIC BANK (PBB)</option>
                        <option value="RHB BANK">RHB BANK</option>
                        <option value="Others">Others (Lain-lain)</option>
                    </select>
                    <div id="otherBankContainer" class="hidden other-input">
                        <input type="text" id="OtherBankInput" placeholder="Sila nyatakan bank lain">
                    </div>
                </div>

                <!-- Bank Account No -->
                <div class="form-group">
                    <label class="field-required" id="lblBankAccount">Bank Account No.</label>
                    <input type="text" id="sBankAccountNo" placeholder="No. Akaun" required>
                </div>

                <!-- EPF -->
                <div class="form-group">
                    <label class="field-required" id="lblEPF">EPF (kwsp) No.</label>
                    <input type="text" id="sEPF" placeholder="No. KWSP" required>
                </div>

                <!-- PERKESO -->
                <div class="form-group">
                    <label class="field-required" id="lblPERKESO">PERKESO NO.</label>
                    <input type="text" id="sPERKESO" placeholder="No. PERKESO" required>
                </div>

                <!-- EIS -->
                <div class="form-group">
                    <label class="field-required" id="lblEIS">EIS NO.</label>
                    <input type="text" id="sEIS" placeholder="No. EIS" required>
                </div>

                <!-- 24Jam Lindungan -->
                <div class="form-group">
                    <label class="field-required" id="lblLindungan">24Jam Lindungan</label>
                    <select id="sLindungan" required>
                        <option value="">-- Pilih --</option>
                        <option value="YES">YES</option>
                        <option value="NO">NO</option>
                    </select>
                </div>

                <!-- Yellow Card -->
                <div class="form-group">
                    <label class="field-required" id="lblYellowCard">Kad Kebersihan (Yellow Card)</label>
                    <select id="sYellowCard" required>
                        <option value="">-- Pilih --</option>
                        <option value="YES">YES</option>
                        <option value="NO">NO</option>
                    </select>
                </div>

                <!-- Login Password -->
                <div class="form-group">
                    <label class="field-required" id="lblLoginPassword">Login Password</label>
                    <input type="password" id="sLoginPassword" placeholder="Kata Laluan" required>
                </div>

                <!-- Phone Type (hidden - auto detected) -->
                <input type="hidden" id="sPhoneType" value="">

                <button type="submit" class="btn btn-success" id="signupSubmitBtn">📤 Daftar</button>
                <button type="button" class="btn btn-gray" onclick="goBack()">← Kembali</button>
            </form>
        </div>

        <!-- ========== LOGIN FORM ========== -->
        <div id="loginForm" class="hidden">
            <h2 id="loginTitle">🔐 Log Masuk</h2>
            <div class="form-group">
                <label class="field-required" id="lblLoginCode">Code</label>
                <input type="text" id="lCode" placeholder="Masukkan Code">
            </div>
            <div class="form-group">
                <label class="field-required" id="lblLoginPassword2">Password</label>
                <input type="password" id="lPassword" placeholder="Kata Laluan">
            </div>
            <button class="btn btn-primary" id="loginSubmitBtn" onclick="performLogin()">🔓 Log Masuk</button>
            <button type="button" class="btn btn-gray" onclick="goBack()">← Kembali</button>
            <div id="loginResult" style="margin-top:12px; text-align:center; font-weight:600;"></div>
        </div>

        <!-- ========== PROFILE ========== -->
        <div id="profileView" class="hidden">
            <h2 id="profileTitle">👤 Profil Staf</h2>
            <div style="text-align:center; font-size:13px; color:#718096; margin-bottom:12px;">
                ✏️ Klik pada mana-mana medan untuk sunting
            </div>
            <div id="profileFields"></div>
            <button class="btn btn-danger" onclick="logout()">🚪 Update & Log Keluar</button>
        </div>

        <!-- ========== MENU SECTION (下半部分) ========== -->
        <div class="menu-section" id="menuSection">
            <div class="menu-title">📋 MENU NAVIGASI</div>
            <div class="menu-grid">
                <button class="btn btn-menu" onclick="navigateTo('staffinfo')">📇 Staff Info</button>
                <button class="btn btn-menu" onclick="navigateTo('staffmanagement')">👥 Staff Management</button>
                <button class="btn btn-menu" onclick="navigateTo('xxx1')">📁 Menu 1</button>
                <button class="btn btn-menu" onclick="navigateTo('xxx2')">📁 Menu 2</button>
                <button class="btn btn-menu" onclick="navigateTo('xxx3')">📁 Menu 3</button>
                <button class="btn btn-menu" onclick="navigateTo('xxx4')">📁 Menu 4</button>
            </div>
        </div>
    </div>

    <!-- ========== AUTH OVERLAY ========== -->
    <div class="auth-overlay hidden" id="authOverlay">
        <div class="auth-box">
            <h3>🔐 Akses Dilindungi</h3>
            <p style="text-align:center; color:#718096; margin-bottom:16px; font-size:14px;">Sila log masuk untuk mengakses halaman ini</p>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="overlayUsername" placeholder="Masukkan username" value="SIANGSIANG">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="overlayPassword" placeholder="Masukkan password">
            </div>
            <button class="btn btn-primary" onclick="authenticateOverlay()">🔓 Log Masuk</button>
            <button class="btn btn-gray" onclick="closeOverlay()">Batal</button>
            <div class="error-msg" id="overlayError">Username atau Password salah!</div>
        </div>
    </div>

    <script>

        function setLoading(btnId, isLoading, text) {
            const btn = document.getElementById(btnId);
            if (isLoading) {

            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.originalText || btn.textContent;
            }
        }

        // ============= PHONE TYPE DETECTION =============
        function detectPhoneType() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            let device = 'Unknown';
            
            if (/android/i.test(userAgent)) {
                device = 'Android';
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                device = 'iOS';
            } else if (/Windows Phone/i.test(userAgent)) {
                device = 'Windows Phone';
            } else if (/Macintosh|Mac OS X/i.test(userAgent)) {
                device = 'Mac';
            } else if (/Windows/i.test(userAgent)) {
                device = 'Windows';
            } else if (/Linux/i.test(userAgent)) {
                device = 'Linux';
            }
            
            if (navigator.userAgentData && navigator.userAgentData.platform) {
                device = navigator.userAgentData.platform;
            }
            
            document.getElementById('sPhoneType').value = device;
        }

        function handleBankChange() {
            const bank = document.getElementById('sBankNama').value;
            const otherContainer = document.getElementById('otherBankContainer');
            const accInput = document.getElementById('sBankAccountNo');
            
            if (bank === 'CASH' || bank === 'MECHANTRADE') {
                accInput.value = '-';
                accInput.readOnly = true;
                accInput.required = false;
            } else {
                accInput.readOnly = false;
                accInput.required = true;

            if (bank === 'Others') {
                otherContainer.classList.remove('hidden');
            } else {
                otherContainer.classList.add('hidden');
                document.getElementById('OtherBankInput').value = '';
            }
        }

        // ============= REGISTER =============
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const code = document.getElementById('sCode').value.trim();
            const name = document.getElementById('sName').value.trim();
            const password = document.getElementById('sLoginPassword').value.trim();
            
            const requiredIds = [
                'sGroupName', 'sCode', 'sName', 'sJantina', 'sTarikhLahir',
                'sSalary', 'sIC', 'sJawatan', 'sTarikhMasukKerja', 'sTelefonNo',
                'sShiftType', 'sOffDay', 'sAlamatTetap', 'sBankNama',
                'sBankAccountNo', 'sEPF', 'sPERKESO', 'sEIS', 'sLindungan',
                'sYellowCard', 'sLoginPassword'
            ];
            
            for (let id of requiredIds) {
                const el = document.getElementById(id);
                if (!el || !el.value.trim()) {
                    showAlert(t('required'));
                    el.focus();
                    return;
                }
            }
            
            const bank = document.getElementById('sBankNama').value;
            const accInput = document.getElementById('sBankAccountNo');
            if (bank !== 'CASH' && bank !== 'MECHANTRADE' && !accInput.value.trim()) {
                showAlert('Sila masukkan Bank Account No.');
                accInput.focus();
                return;
            }
            
            let groupVal = document.getElementById('sGroupName').value;
            if (groupVal === 'Others') {
                const other = document.getElementById('OtherGroupInput').value.trim();
                if (!other) {
                    showAlert('Sila nyatakan kumpulan lain / Please specify other group');
                    document.getElementById('OtherGroupInput').focus();
                    return;
                }
                groupVal = other;
            }
            
            let bankVal = document.getElementById('sBankNama').value;
            if (bankVal === 'Others') {
                const other = document.getElementById('OtherBankInput').value.trim();
                if (!other) {
                    showAlert('Sila nyatakan bank lain / Please specify other bank');
                    document.getElementById('OtherBankInput').focus();
                    return;
                }
                bankVal = other;
            }
            
            let shiftVal = document.getElementById('sShiftType').value;
            if (shiftVal === 'Others') {
                const other = document.getElementById('OtherShiftInput').value.trim();
                if (!other) {
                    showAlert('Sila nyatakan waktu shift / Please specify shift time');
                    document.getElementById('OtherShiftInput').focus();
                    return;
                }
                shiftVal = other;
            }

            const phoneType = document.getElementById('sPhoneType').value || 'Unknown';

            const data = {

                Code: code,
                Name: name,
                Jantina: document.getElementById('sJantina').value,
                TarikhLahir: document.getElementById('sTarikhLahir').value,
                Salary: document.getElementById('sSalary').value.trim(),

                Email: document.getElementById('sEmail').value.trim(),

                AlamatTetap: document.getElementById('sAlamatTetap').value.trim(),
                NamaWaris: document.getElementById('sNamaWaris').value.trim(),
                AlamatWaris: document.getElementById('sAlamatWaris').value.trim(),
                BankNama: bankVal,
                BankAccountNo: document.getElementById('sBankAccountNo').value.trim(),
                EPF: document.getElementById('sEPF').value.trim(),
                PERKESO: document.getElementById('sPERKESO').value.trim(),
                EIS: document.getElementById('sEIS').value.trim(),
                Lindungan: document.getElementById('sLindungan').value,
                YellowCard: document.getElementById('sYellowCard').value,
                LoginPassword: password,
                PhoneType: phoneType,
            };

            const btn = document.getElementById('signupSubmitBtn');
            btn.dataset.originalText = btn.innerHTML;
            setLoading('signupSubmitBtn', true, t('registering'));

            console.log('📤 Sending data:', data);

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(data)
            })
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(result => {
                setLoading('signupSubmitBtn', false);
                console.log('📥 Response:', result);
                
                if (result.result === 'success') {
                    showAlert('✅ Pendaftaran berjaya!', 'success');
                    document.getElementById('registerForm').reset();

                    document.getElementById('otherGroupContainer').classList.add('hidden');

                }

            .catch(err => {
                setLoading('signupSubmitBtn', false);
                console.error('❌ Fetch error:', err);
                showAlert('❌ ' + t('networkError') + ': ' + err.message);
            });

        // ============= LOGIN =============
        function performLogin() {
            const code = document.getElementById('lCode').value.trim();
            const password = document.getElementById('lPassword').value.trim();

            if (!code || !password) {
                showAlert('Sila masukkan Code dan Password.');
                return;
            }

            const btn = document.getElementById('loginSubmitBtn');
            btn.dataset.originalText = btn.innerHTML;
            setLoading('loginSubmitBtn', true, t('loggingIn'));

            fetch(SCRIPT_URL + '?action=getData')
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(data => {
                setLoading('loginSubmitBtn', false);
                console.log('📥 Login data:', data);
                
                if (data.error) {
                    showAlert('❌ ' + data.error);
                    return;
                }
                
                if (!data || data.length === 0) {
                    showAlert(t('noData'));
                    return;
                }
                
                const user = data.find(row => row.Code === code && row.LoginPassword === password);
                if (user) {
                    currentUser = user;
                    showAlert('✅ ' + t('loginSuccess'), 'success');
                    displayProfile(user);
                } else {
                    showAlert('❌ ' + t('loginFail'));
                }
            })
            .catch(err => {
                setLoading('loginSubmitBtn', false);
                console.error('❌ Login error:', err);
                showAlert('❌ ' + t('networkError') + ': ' + err.message);
            });
        }

            const labels = {
                GroupName: 'Group Name', Code: 'Code', Name: 'Name',
                Jantina: 'Jantina', TarikhLahir: 'Tarikh Lahir', Salary: 'Salary',
                IC: 'IC/Passport/Doc.No', Jawatan: 'Jawatan',
                TarikhMasukKerja: 'Tarikh Masuk Kerja', TelefonNo: 'Telefon No.',
                Email: 'Email', ShiftType: 'Shift Type', OffDay: 'Off Day',
                AlamatTetap: 'Alamat Tetap', NamaWaris: 'Nama Waris',
                AlamatWaris: 'Alamat Waris', BankNama: 'Bank Nama',
                BankAccountNo: 'Bank Account No.', EPF: 'EPF (kwsp) No.',
                PERKESO: 'PERKESO NO.', EIS: 'EIS NO.',
                Lindungan: '24Jam Lindungan',
                YellowCard: 'Kad Kebersihan (Yellow Card)',
                LoginPassword: 'Login Password', PhoneType: 'Phone Type',
                SignupDate: 'Signup Date', UpdateDate: 'Update Date'
            };

            for (let key of fields) {
                const val = user[key] || '';
                const div = document.createElement('div');
                div.className = 'profile-field';
                
                const label = document.createElement('label');
                label.textContent = labels[key] || key + ':';
                
                const input = document.createElement('input');
                input.type = (key === 'LoginPassword') ? 'password' : 'text';
                input.value = val;
                input.dataset.field = key;
                input.id = 'prof_' + key;
                input.placeholder = 'Klik untuk sunting';
                
                input.addEventListener('change', function() {
                    currentUser[key] = this.value;
                    currentUser.UpdateDate = new Date().toISOString();
                    saveProfile();
                });
                
                div.appendChild(label);
                div.appendChild(input);
                container.appendChild(div);
            }
        }

        // ============= SAVE PROFILE =============
        function saveProfile() {
            if (!currentUser || !currentUser.Code) return;

            const payload = {
                action: 'update',
                ...currentUser
            };

            console.log('💾 Saving profile:', payload);

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(payload)
            })
            .then(response => response.json())
            .then(result => {
                if (result.result === 'success') {
                    showAlert('✅ ' + t('saveSuccess'), 'success');
                } else {
                    showAlert('⚠️ ' + t('saveFail') + ': ' + (result.message || ''));
                }
            })
            .catch(err => {
                console.error('❌ Save error:', err);
                showAlert('⚠️ ' + t('saveFail') + ': ' + err.message);
            });
        }

        // ============= MENU NAVIGATION =============
        const protectedPages = ['staffinfo', 'xxx1', 'xxx2', 'xxx3', 'xxx4'];
        const unprotectedPages = ['staffmanagement'];

        function navigateTo(page) {
            if (page === 'staffmanagement') {
                // 当前页面，不做跳转，只是滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showAlert('📍 Anda berada di halaman Staff Management', 'info');
                return;
            }

            if (page === 'staffinfo') {
                // 直接跳转到 staffinfo.html（同一仓库下）
                window.location.href = 'staffinfo.html';
                return;
            }

            // 其他受保护的页面 (xxx1, xxx2, xxx3, xxx4)
            // 显示认证弹窗
            pendingNavigation = page;
            showAuthOverlay();
        }

        // ============= AUTH OVERLAY =============
        function showAuthOverlay() {
            const overlay = document.getElementById('authOverlay');
            overlay.classList.remove('hidden');
            document.getElementById('overlayUsername').value = 'SIANGSIANG';
            document.getElementById('overlayPassword').value = '';
            document.getElementById('overlayError').style.display = 'none';
            document.getElementById('overlayPassword').focus();
        }

        function closeOverlay() {
            document.getElementById('authOverlay').classList.add('hidden');
            pendingNavigation = null;
        }

        function authenticateOverlay() {
            const username = document.getElementById('overlayUsername').value.trim();
            const password = document.getElementById('overlayPassword').value.trim();

            if (!username || !password) {
                document.getElementById('overlayError').textContent = t('authRequired');
                document.getElementById('overlayError').style.display = 'block';
                return;
            }

            // 验证用户名和密码
            if (username === 'SIANGSIANG' && password === '0000') {
                // 认证成功
                document.getElementById('overlayError').style.display = 'none';
                closeOverlay();
                
                // 执行跳转
                if (pendingNavigation) {
                    if (pendingNavigation === 'staffinfo') {
                        window.location.href = 'staffinfo.html';
                    } else {
                        // 其他页面 - 显示提示信息（模拟跳转）
                        showAlert('📍 Halaman "' + pendingNavigation + '" akan dibuka (demo)', 'success');
                        // 在实际项目中，这里可以跳转到对应的页面
                        // window.location.href = pendingNavigation + '.html';
                    }
                    pendingNavigation = null;
                }
            } else {
                document.getElementById('overlayError').textContent = t('authError');
                document.getElementById('overlayError').style.display = 'block';
                document.getElementById('overlayPassword').value = '';
                document.getElementById('overlayPassword').focus();
            }
        }

        // 按 Enter 键提交认证
        document.getElementById('overlayPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                authenticateOverlay();
            }
        });
        document.getElementById('overlayUsername').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('overlayPassword').focus();
            }
        });

        // 点击 overlay 背景关闭
        document.getElementById('authOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeOverlay();
            }
        });

        // ============= INIT =============
        window.addEventListener('load', function() {
            detectPhoneType();
            setTimeout(testConnection, 500);
            setLanguage('ms');
        });

        console.log('🚀 Staff System loaded');
        console.log('📡 SCRIPT_URL:', SCRIPT_URL);
        console.log('📱 Phone Type:', document.getElementById('sPhoneType')?.value || 'Not detected');
        console.log('🔒 Protected pages require login: SIANGSIANG / 0000');
    </script>
</body>
</html>
