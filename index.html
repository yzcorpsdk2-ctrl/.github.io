<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端备份实验</title>
    <style>
        body { font-family: system-ui; max-width: 500px; margin: 50px auto; padding: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; background: #2b6c94; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #message { margin-top: 20px; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>📬 数据云端备份实验</h2>
    <form id="myForm">
        <label for="Name">你的名字</label>
        <input type="text" id="Name" name="Name" required>

        <label for="Email">你的邮箱</label>
        <input type="email" id="Email" name="Email" required>

        <label for="Message">留言</label>
        <textarea id="Message" name="Message" rows="4" required></textarea>

        <button type="submit">📤 提交到云端</button>
    </form>
    <div id="message"></div>

    <script>
        // 【重要】把这里替换成你的 Google Apps Script Web App URL！
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwBnUhIzKkkfRSMB4BP6r2ZRnD9To1DZ08oZ3K_kyIcWa_qmTgUsK6Vc1Sjr2eH-nTeqA/exec';
        const form = document.getElementById('myForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // 阻止页面刷新
            messageDiv.textContent = '⏳ 提交中...';
            messageDiv.className = '';

            // 创建 FormData 对象，它会自动抓取表单里所有有 name 属性的字段
            const formData = new FormData(form);

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.result === 'success') {
                    messageDiv.textContent = '✅ 数据保存成功！去你的 Google Sheets 看看吧。';
                    messageDiv.className = 'success';
                    form.reset(); // 清空表单
                } else {
                    throw new Error('保存失败');
                }
            } catch (error) {
                messageDiv.textContent = `❌ 出错了：${error.message}`;
                messageDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
